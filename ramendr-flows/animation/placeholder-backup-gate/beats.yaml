  # ---------------------------------------------------------------- chapter 6
  - id: "6.1"
    chapter: The fix that did not work
    visual: The obvious repair
    narration: "The obvious fix is to turn the import back on. If the Backup record were imported from the bucket instead of created, there would be no duplicate, and the phase would be Completed."
    evidence: "RamenDR/ramen#2940, described in the #2947 revert"

  - id: "6.2"
    chapter: The fix that did not work
    visual: Someone tried it
    narration: "Someone tried exactly that. A Ramen change left the storage location's refresh period unset on recover locations, so Velero would import the real archive."
    evidence: "RamenDR/ramen#2940, reverted by #2947"

  - id: "6.3"
    chapter: The fix that did not work
    visual: Merged, then reverted
    narration: "It merged, and then it was reverted on the fourth of November. The revert explains why, and the reason is precise."
    evidence: "RamenDR/ramen#2947, merged 2026-11-04"

  - id: "6.4"
    chapter: The fix that did not work
    visual: Import does not overwrite
    narration: "Importing does not overwrite records that already exist. Velero compares the archives in the bucket with the Backup objects in the cluster, and imports only the difference."
    evidence: "RamenDR/ramen#2947 merge description, backupsToSync difference set"

  - id: "6.5"
    chapter: The fix that did not work
    visual: Two sets, one difference, one skip
    narration: "Two sets. Archives in the bucket, records in the cluster. Import takes the difference. The placeholder is already in the second set, so it is never imported."
    evidence: "RamenDR/ramen#2947 merge description"
    pause_after: 1.6

  - id: "6.6"
    chapter: The fix that did not work
    visual: The placeholder stays failed
    narration: "Ramen creates the placeholder before the import could ever see it. So the placeholder stays failed, the Restore still points at it, and the validation still refuses it."
    evidence: "RamenDR/ramen#2947 merge description"

  - id: "6.7"
    chapter: The fix that did not work
    visual: The revert
    narration: "The fix changed nothing, and it was reverted rather than left in place."
    evidence: "RamenDR/ramen#2947"

  - id: "6.8"
    chapter: The fix that did not work
    visual: The second reason
    narration: "There was a second reason too. Turning import on globally can pull stale archives back into view, objects Ramen deliberately keeps out of the cluster."
    evidence: "RamenDR/ramen#2947 merge description, added risk"

  - id: "6.9"
    chapter: The fix that did not work
    visual: What the real fix must do
    narration: "The maintainers' conclusion is that the real fix must avoid creating the failed placeholder at all, so Velero can import the real Completed archive in a scoped way, and then restore from that."
    evidence: "RamenDR/ramen#2947 merge description, real fix paragraph"
    pause_after: 1.4

  - id: "6.10"
    chapter: The fix that did not work
    visual: No fix exists
    narration: "That fix does not exist yet. The defect is open and new."
    evidence: "DFBUGS-12505 status New, priority Major"

  - id: "6.11"
    chapter: The fix that did not work
    visual: No happy ending
    narration: "So this video cannot end with, and then it was fixed. It ends with a mechanism, a rejected fix, and a direction."
    evidence: "DFBUGS-12505 and RamenDR/ramen#2947"

  - id: "6.12"
    chapter: The fix that did not work
    visual: The lesson in the rejected fix
    narration: "There is a lesson in the rejected fix that is worth more than the fix itself. The obvious repair failed because of how a set difference works, not because of effort. Understanding the mechanism was the only way to see it."
    evidence: "RamenDR/ramen#2947 merge description"
    pause_after: 1.8

  # ---------------------------------------------------------------- chapter 7
  - id: "7.1"
    chapter: What the record proves
    t: "2026-11-05T08:05:57Z"
    visual: Recap on the timeline
    narration: "Recap the recorded run. Relocate at seven fifty-four. Source machine deleted at eight oh one. Disks bound and cluster data restored by eight oh three. Kube objects restore refused at eight oh three fifty-two, and retried at eight oh five fifty-seven."
    evidence: "DFBUGS-12505 supplement timeline"

  - id: "7.2"
    chapter: What the record proves
    visual: What is proven
    narration: "What the record proves: the storage half completed. The object half did not. The duplicate Backup was created by Ramen with the archive's name, and Velero failed it. The Restore was refused on phase, and the namespace has no virtual machine."
    evidence: "attachment, S3, Backup, Restore, VRG and namespace blocks"

  - id: "7.3"
    chapter: What the record proves
    visual: What stays open
    narration: "What stays unverified: which commit built the running controllers, which exactly changed the outcome, whether the image upgrade alone explains the regression, and what the fix will be."
    evidence: "trace.md, deployed-build provenance and causal claim"
    unverified: "Deployed commits, the causal effect of the image change, and the fix."
    pause_after: 1.6

  - id: "7.4"
    chapter: What the record proves
    visual: Check one, the condition
    narration: "If you take one check from this video, take this one. Read Kube Objects Ready and its message, not the completion fields. It is the only condition that answers whether the workload came back."
    evidence: "attachment, KubeObjectsReady False (Error)"

  - id: "7.5"
    chapter: What the record proves
    visual: Check two, the namespace
    narration: "Then look at the target namespace. A bound claim, a secret, and no virtual machine is a specific shape. Once you have seen it, you will recognise it in one glance."
    evidence: "attachment, target namespace block"

  - id: "7.6"
    chapter: What the record proves
    visual: Check three, the two Velero records
    narration: "Then read the Backup and Restore records. A Backup in Failed with the name of an existing archive tells you the collision happened. A Restore in Failed Validation tells you Velero refused it."
    evidence: "attachment, Backup and Restore lines"

  - id: "7.7"
    chapter: What the record proves
    visual: The completion fields answer less
    narration: "None of the three replaces the completion fields. They answer a smaller question than the one you are asking. Relocated means the storage contract was met, and it was."
    evidence: "DFBUGS-12505 DRPC status"

  - id: "7.8"
    chapter: What the record proves
    visual: Where this sits for GA
    narration: "For the product, this sits on the GA feature. The Dell Power Store feature requires planned and unplanned failover, failback and re-protection to pass qualification, and it requires a return to the original site to leave no stuck resources."
    evidence: "VIRTDR-361 requirements 2 and 3, acceptance criteria on failback"

  - id: "7.9"
    chapter: What the record proves
    visual: The tests that exercise it
    narration: "The planned relocation test cases for a discovered application, console-driven and A P I-driven, exercise exactly this path. The next manual test run is the one that would catch it again."
    evidence: "VIRTDR-424 and VIRTDR-425 Draft test cases, VIRTDR-411 execute manual test run"

  - id: "7.10"
    chapter: What the record proves
    visual: What a fix must do
    narration: "A fix would have to stop creating a failed record. Import the real archive in a scoped way, or create the record only after the archive is visible, and never restore from a record you know is failed."
    evidence: "RamenDR/ramen#2947 merge description, real fix paragraph"

  - id: "7.11"
    chapter: What the record proves
    visual: The operational answer
    narration: "Until then, the operational answer is to check both halves before believing a move. Disks, definitions, guest."
    evidence: "DFBUGS-12505, three recorded checks"
