# yamllint disable rule:line-length
# Zerto enablement primer: OpenShift Virtualization and disaster recovery.
# Evidence: Setup Google Doc, Dell notes, live hub console captures, upstream KubeVirt/Ramen source trace.
beats:
  - id: "0.1"
    chapter: "Cold open"
    visual: "Cold open: a VM card sits inside a pod outline, then the DR chain lights up."
    narration: "This is a short course for the Zerto team. It explains how a virtual machine runs on OpenShift Virtualization, what disaster recovery must rebuild around it, and where a Zerto style solution can plug in."
    pause_after: 1.6

  - id: "1.1"
    chapter: "Cast of characters"
    visual: "Glossary grid, then one card at a time."
    narration: "First, the cast. Every object in this story is a Kubernetes object, and each one has one small job."
  - id: "1.2"
    chapter: "Cast of characters"
    visual: "Pod card with its plain-language role."
    card:
      kind: Pod
      name: virt-launcher-hammerdb-rhel9-q66lw
      role: "the sandbox that runs the VM process on one node"
    def:
      what: "The smallest unit Kubernetes schedules: one or more containers that share a network address."
      creator: "The KubeVirt controller creates it for a running VM."
      reader: "The kubelet and the scheduler."
      where: "A worker node, in the workload namespace."
      analogy: "A shipping container on a specific truck."
    narration: "A pod is the smallest unit Kubernetes schedules. It is one or more containers that share a network address and run on one node."
  - id: "1.3"
    chapter: "Cast of characters"
    card:
      kind: VirtualMachine
      name: hammerdb-rhel9
      role: "the desired state: this VM should exist"
    def:
      what: "The management object that records the VM hardware, disks, and power intent."
      creator: "A user, Git, or an Application."
      reader: "The virt-controller."
      where: "The workload namespace on a spoke."
      analogy: "A saved recipe, not the meal."
    narration: "A VirtualMachine object is the desired state. It says this VM should exist, what hardware it has, and which disks it uses. It is not the running process."
  - id: "1.4"
    chapter: "Cast of characters"
    card:
      kind: VirtualMachineInstance
      name: hammerdb-rhel9
      role: "one running copy of the VM"
    def:
      what: "The live instance created from a VirtualMachine template."
      creator: "The virt-controller, when the VM should run."
      reader: "The scheduler, virt-handler, and the console."
      where: "The workload namespace, pinned to a node."
      analogy: "The meal that is actually cooking."
    narration: "A VirtualMachineInstance is one running copy of that VM. The controller creates it when the VM should be on, and deletes it when the VM stops."
  - id: "1.5"
    chapter: "Cast of characters"
    card:
      kind: Pod
      name: virt-launcher
      role: "the pod that runs libvirt and QEMU"
    def:
      what: "A per-VM pod whose compute container runs libvirt and QEMU."
      creator: "The virt-controller, from the VMI."
      reader: "virt-handler and the kubelet."
      where: "The worker node selected for the VMI."
      analogy: "The engine room of the VM."
    narration: "virt-launcher is the pod that actually runs the VM. Inside it, libvirt and QEMU start, and the guest operating system boots."
  - id: "1.6"
    chapter: "Cast of characters"
    card:
      kind: DataVolume
      name: hammerdb-rhel9-rootdisk
      role: "a PVC plus a recipe to fill it"
    def:
      what: "A CDI object that creates a PVC and fills it by import, clone, or a blank disk."
      creator: "The VM template or a user."
      reader: "CDI and the virt-controller."
      where: "The workload namespace."
      analogy: "A disk order that also includes the copying service."
    narration: "A DataVolume is a PVC plus a recipe. It can import an image, clone a disk, or create a blank disk, then hand the PVC to the VM."
  - id: "1.7"
    chapter: "Cast of characters"
    card:
      kind: PersistentVolumeClaim
      name: hammerdb-rhel9-rootdisk
      role: "the request, bound one to one with a PV"
    def:
      what: "A workload's request for storage, bound to a PersistentVolume."
      creator: "The DataVolume, or a user."
      reader: "The pod, the scheduler, and the CSI driver."
      where: "The workload namespace."
      analogy: "A claim ticket for a specific locker."
    narration: "A PVC is the workload's request for storage. A PV is the cluster object that represents the real disk on the array. They are bound one to one."
  - id: "1.8"
    chapter: "Cast of characters"
    card:
      kind: StorageClass
      name: powerstore-sc
      role: "the recipe the CSI driver follows"
    def:
      what: "A named provisioning recipe, backed by a CSI driver."
      creator: "The storage administrator."
      reader: "The PVC controller and the CSI driver."
      where: "Cluster scope."
      analogy: "A menu entry that tells the kitchen what to make."
    narration: "A StorageClass names a provisioning recipe. The CSI driver behind it talks to the storage array and creates the real volume."
  - id: "1.9"
    chapter: "Cast of characters"
    card:
      kind: VolumeReplication
      name: hammerdb-rhel9-rootdisk
      role: "per-disk replicate, promote, demote"
    def:
      what: "A csi-addons object that tells the driver to replicate one volume."
      creator: "The VolumeReplicationGroup."
      reader: "The csi-addons controller and the storage driver."
      where: "The workload namespace."
      analogy: "A standing order for one specific disk."
    narration: "A VolumeReplication is a per-disk instruction to the CSI driver. It says replicate this disk, and later promote or demote it."
  - id: "1.10"
    chapter: "Cast of characters"
    card:
      kind: VolumeReplicationGroup
      name: dell-vm-drpc
      role: "all the protected disks of one application"
    def:
      what: "A Ramen object that groups the protected PVCs and their replication state."
      creator: "The DRPlacementControl, delivered by a ManifestWork."
      reader: "Ramen on the spoke."
      where: "The workload namespace, or the ops namespace for discovered apps."
      analogy: "A binder that holds every disk order for one application."
    narration: "A VolumeReplicationGroup groups every protected disk of one application. It creates one VolumeReplication per PVC and reports whether the group is protected."
  - id: "1.11"
    chapter: "Cast of characters"
    card:
      kind: DRPolicy
      name: dr-policy-15m
      role: "which clusters pair up, and how often"
    def:
      what: "The cluster-level DR contract: the two clusters and the replication interval."
      creator: "The DR administrator."
      reader: "The DRPC and DRCluster controllers."
      where: "Cluster scope on the hub."
      analogy: "A service level agreement between two sites."
    narration: "A DRPolicy is the cluster-level contract. It names the two clusters and the replication interval, and it is validated before any application can use it."
  - id: "1.12"
    chapter: "Cast of characters"
    card:
      kind: DRPlacementControl
      name: dell-vm-drpc
      role: "the per-application DR request"
    def:
      what: "The per-application object that names the policy, placement, PVC selector, and action."
      creator: "A user, Git, or the console enrollment flow."
      reader: "Ramen on the hub."
      where: "The hub, in the application or ops namespace."
      analogy: "A work order that says what to protect and where to move it."
    narration: "A DRPlacementControl is the per-application request. It points at a policy, a placement, and a label selector for the PVCs, and it carries the failover action."
  - id: "1.13"
    chapter: "Cast of characters"
    card:
      kind: Placement
      name: dell-vm-placement
      role: "the rule for choosing a cluster"
    def:
      what: "An ACM object that defines how a cluster is selected."
      creator: "The application owner."
      reader: "The placement controller and the ApplicationSet generator."
      where: "The hub, in the Argo CD namespace for managed apps."
      analogy: "A hiring rule, not the hired person."
    narration: "A Placement is the rule for choosing a cluster. A PlacementDecision records the cluster that was chosen. Ramen writes the decision when it moves an application."
  - id: "1.14"
    chapter: "Cast of characters"
    card:
      kind: ManifestWork
      name: dell-vm-drpc-gitops-vms-vrg-mw
      role: "the hub-to-spoke delivery envelope"
    def:
      what: "An ACM object that carries resources to one managed cluster."
      creator: "Ramen on the hub."
      reader: "The klusterlet agent on the spoke."
      where: "The managed cluster namespace on the hub."
      analogy: "A sealed package delivered to a branch office."
    narration: "A ManifestWork is an envelope from the hub to a managed cluster. The spoke agent applies the resources inside it locally."
  - id: "1.15"
    chapter: "Cast of characters"
    card:
      kind: Bucket
      name: ramen-metadata
      role: "external notebook of PV and PVC definitions"
    def:
      what: "An S3 bucket that holds Ramen's copies of PV and PVC objects."
      creator: "The DR administrator, with the MinIO deployment."
      reader: "Ramen on both clusters."
      where: "The hub cluster, in this lab."
      analogy: "A safe deposit box for the paperwork, separate from the vault."
    narration: "The S3 bucket is an external notebook. Ramen stores copies of the PV and PVC definitions there, because the array copies blocks but not Kubernetes objects."
  - id: "1.16"
    chapter: "Cast of characters"
    card:
      kind: ApplicationSet
      name: dell-vm-workload
      role: "a template that generates one Application per cluster"
    def:
      what: "An Argo CD template that generates Applications from a generator."
      creator: "The platform team, in Git."
      reader: "The Argo CD ApplicationSet controller."
      where: "The hub, in openshift-gitops."
      analogy: "A mail merge that produces one letter per recipient."
    narration: "An ApplicationSet is a GitOps template that generates one Application per selected cluster. The Application is what Argo CD actually syncs."
  - id: "1.17"
    chapter: "Cast of characters"
    card:
      kind: Backup
      name: OADP + Velero
      role: "backs up Kubernetes objects"
    def:
      what: "Red Hat's packaging of Velero, used to back up and restore Kubernetes objects."
      creator: "The platform team."
      reader: "Ramen, during kube object protection and recovery."
      where: "Each spoke, in openshift-adp."
      analogy: "A photocopy of the building plan, kept off site."
    narration: "OADP is Red Hat's packaging of Velero. It backs up Kubernetes objects, so a recovered cluster can recreate the VM, its DataVolumes, and its Secrets."
  - id: "1.18"
    chapter: "Cast of characters"
    visual: "All glossary cards in one grid, grouped by role."
    narration: "That is the cast. Nine Kubernetes and KubeVirt objects describe the VM, five describe storage and replication, and the rest coordinate recovery."
    pause_after: 1.4

  - id: "2.1"
    chapter: "A VM is a pod"
    visual: "Focus the site region; the pod outline pulses."
    narration: "The first surprise for a VMware engineer is that there is no hypervisor layer to log into. A VM is a Kubernetes workload, and Kubernetes schedules it like any other pod."
  - id: "2.2"
    chapter: "A VM is a pod"
    visual: "VM card to VMI card, then the VMI card shows a node."
    narration: "When the VirtualMachine says run, virt-controller creates a VirtualMachineInstance. The VMI is the live object. It holds the schedule, the node, and the conditions."
  - id: "2.3"
    chapter: "A VM is a pod"
    visual: "VMI to virt-launcher pod on worker-2."
    narration: "The VMI is not a process on the host. virt-controller renders a pod, and the scheduler places it on a worker. In this lab the pod is virt launcher hammerdb rhel nine q sixty six l w on worker two."
  - id: "2.4"
    chapter: "A VM is a pod"
    visual: "Inside the pod: libvirt and QEMU, then the guest."
    narration: "Inside that pod, the compute container starts libvirt and QEMU. QEMU emulates the hardware, and the RHEL guest boots on top of it. The guest thinks it owns a disk and a network card."
  - id: "2.5"
    chapter: "A VM is a pod"
    visual: "QEMU to block device to PVC."
    narration: "The disk is a PVC attached to the pod as a block device. QEMU opens that device and presents it to the guest as a virtual disk."
  - id: "2.6"
    chapter: "A VM is a pod"
    visual: "Screenshot: VM details conditions."
    screenshot: "02-vm-details-conditions.png"
    focus: {x: 330, y: 740, w: 1180, h: 320}
    caption: "VirtualMachine conditions. Ready and DataVolumesReady are true, and LiveMigratable is false because the disks are not shared."
    narration: "The console shows the same object with conditions. Ready is true, the DataVolumes are ready, and live migration is false because the disks are not shared."
  - id: "2.7"
    chapter: "A VM is a pod"
    visual: "Screenshot: related resources list."
    screenshot: "03-vm-related-resources.png"
    focus: {x: 330, y: 280, w: 1180, h: 430}
    caption: "One VirtualMachine, viewed through the hub, owns or references two DataVolumes, two PVCs, two PVs, a pod, a Secret, a Service, and a VMI."
    narration: "Related resources makes the graph visible. One VM owns or references two DataVolumes, two PVCs, two PVs, the pod, the Secret, the Service, and the VMI."
  - id: "2.8"
    chapter: "A VM is a pod"
    visual: "Recap: VM, VMI, pod, disk."
    narration: "So a VM is a desired-state object, a running VMI, and a pod that holds QEMU and the guest. The disk lives outside the pod, on the storage array."
    pause_after: 1.2

  - id: "3.1"
    chapter: "The storage path"
    visual: "Storage region focuses, disk cards appear."
    narration: "Disaster recovery is mostly a storage problem. If the disk survives, the VM can be rebuilt. If the disk does not survive, no amount of YAML helps."
  - id: "3.2"
    chapter: "The storage path"
    visual: "PVC card to PV card."
    narration: "The VM's DataVolume creates a PVC. The PVC asks for thirty five gibibytes from powerstore-sc. Kubernetes binds it to a PV, and the PV records the real array volume."
  - id: "3.3"
    chapter: "The storage path"
    visual: "StorageClass to CSIDriver to VSA-A."
    narration: "The StorageClass names the CSI driver. CSI powerstore dot dell emc dot com calls the PowerStore API, creates a volume, and returns its identifier. The PVC and PV carry that identifier."
  - id: "3.4"
    chapter: "The storage path"
    visual: "DataVolume owns PVC; a warning arrow on delete order."
    narration: "The DataVolume is also the owner of the PVC. That is why cleanup order matters. Delete the DataVolume first, and it takes its PVC with it. Delete the PVC first, and the DataVolume can recreate it."
  - id: "3.5"
    chapter: "The storage path"
    visual: "VSA-A volume, VSA-B replica, session arrow."
    narration: "On the array, the volume is a block LUN. VSA-A serves the home cluster. A matching replica volume sits on VSA-B, and the array copies changed blocks to it."
  - id: "3.6"
    chapter: "The storage path"
    visual: "Replication session with 15 minute RPO and 12 minute job ticks."
    narration: "The copy is asynchronous. The policy says every fifteen minutes, and the array schedules sync jobs about every twelve minutes. The gap between the last completed sync and a failure is the real exposure."
  - id: "3.7"
    chapter: "The storage path"
    visual: "Recap chain: PVC, PV, CSI, array."
    narration: "The storage chain is PVC to PV to CSI driver to array volume. Replication is a property of the array volume pair, not of the pod."
    pause_after: 1.2

  - id: "4.1"
    chapter: "The network path"
    visual: "Guest NIC and pod network."
    narration: "The second surprise is the network. The guest has an IP address, but that address belongs to a pod network inside one cluster. It does not stretch to the other site."
  - id: "4.2"
    chapter: "The network path"
    visual: "virt-launcher pod, guest bridge, pod IP."
    narration: "virt launcher attaches the guest to a bridge or to the pod network. The default is masquerade, so the guest reaches the outside through the pod's IP. A Service gives stable access to SSH."
  - id: "4.3"
    chapter: "The network path"
    visual: "Service card and DNS name."
    narration: "The Service is a Kubernetes object with its own name and IP. It selects the virt launcher pod. After a failover the Service is recreated, but the guest's internal address and the external DNS name may change."
  - id: "4.4"
    chapter: "The network path"
    visual: "Two sites, no stretched L2, a client that must reconnect."
    narration: "This lab has no stretched layer two network and no Submariner on the Dell path. Recovery is a reboot on another cluster, not a live move. Plan for DNS, firewall rules, and client reconnection."
  - id: "4.5"
    chapter: "The network path"
    visual: "Recap: Service, guest config, clients."
    narration: "So the network is cluster local. DR must recreate the Service and the guest configuration, and it must tell clients where the new copy is."
    pause_after: 1.2

  - id: "5.1"
    chapter: "What DR must reconstruct"
    visual: "Wide world: disk layer, object layer, guest layer."
    narration: "A VM is more than a disk. To recover it you need the blocks, the Kubernetes objects, and the guest configuration. Miss one layer and the VM may boot but not work."
  - id: "5.2"
    chapter: "What DR must reconstruct"
    visual: "Timeline with RPO and RTO brackets."
    define:
      term: "RPO and RTO"
      text: "RPO is the maximum acceptable data loss in time. RTO is the maximum acceptable recovery time."
    narration: "RPO is how much data you can lose, measured in time. RTO is how long recovery may take. A fifteen minute RPO does not mean every recovery loses fifteen minutes. It means the last sync must be no older than fifteen minutes."
  - id: "5.3"
    chapter: "What DR must reconstruct"
    visual: "Three stacked layers appear."
    narration: "Layer one is the disk. Layer two is the Kubernetes definition: VM, VMI, DataVolumes, PVCs, PVs, Service, and Secret. Layer three is everything inside the guest: the OS, the database, and its startup scripts."
  - id: "5.4"
    chapter: "What DR must reconstruct"
    visual: "Array to S3 to OADP to guest."
    narration: "The array copies layer one. Ramen copies layer two into S3. OADP and Velero restore the objects that Ramen does not own, and the guest brings up layer three when it boots."
  - id: "5.5"
    chapter: "What DR must reconstruct"
    visual: "Crash-consistent disk and a database log replay."
    narration: "Async replication gives crash consistency, not application consistency. The recovered disk looks like the power was pulled at the last sync. Databases replay their logs, and the guest must be able to start unattended."
  - id: "5.6"
    chapter: "What DR must reconstruct"
    visual: "Two paths: backup arrow to the past, replication arrow to the other site."
    narration: "Backup and replication answer different questions. A backup lets you go back to an earlier point. Replication lets you continue on another site with the latest copy. Most DR plans need both."
  - id: "5.7"
    chapter: "What DR must reconstruct"
    visual: "Freeze and unfreeze around a snapshot."
    narration: "If you need application consistency, you must quiesce the guest before the snapshot or sync. KubeVirt exposes freeze and unfreeze, and the guest agent can flush the filesystem."
  - id: "5.8"
    chapter: "What DR must reconstruct"
    visual: "Recap: promote, restore, boot."
    narration: "So DR reconstructs three layers in order: promote the disk, restore the objects, then boot and validate the guest."
    pause_after: 1.2

  - id: "6.1"
    chapter: "The replication layer"
    visual: "Storage region, replication path highlighted."
    narration: "Replication is the part that decides how much data you keep. It runs below Kubernetes, on the storage array, and Kubernetes only asks for it through a small API."
  - id: "6.2"
    chapter: "The replication layer"
    visual: "VRG card creates three VR cards."
    narration: "Ramen creates a VolumeReplicationGroup for the application. The VRG creates one VolumeReplication per protected PVC. Each VolumeReplication names its class and says primary or secondary."
  - id: "6.3"
    chapter: "The replication layer"
    visual: "VolumeReplicationClass card, parameters."
    narration: "The VolumeReplicationClass carries the driver parameters. In this lab powerstore-vrc-15m says replicate asynchronously from VSA-A to VSA-B every fifteen minutes."
  - id: "6.4"
    chapter: "The replication layer"
    visual: "Array session card: role, state, last sync."
    narration: "The CSI driver turns that into a PowerStore replication session. The array copies changed blocks on a schedule. The session has a role, a state, and a last sync time."
  - id: "6.5"
    chapter: "The replication layer"
    visual: "Screenshot: DR status popover."
    screenshot: "08-dr-status-popover.png"
    focus: {x: 850, y: 260, w: 460, h: 260}
    caption: "Volumes last synced at 10:48 UTC and Kubernetes resources at 10:44 UTC, under dr-policy-15m."
    narration: "The console summarizes it as volumes and Kubernetes resources synced. The popover shows the last volume sync, the last object sync, and the policy interval. That is a status, not a guarantee for every disk."
  - id: "6.6"
    chapter: "The replication layer"
    visual: "Session role flips from A source to B source."
    narration: "On failover the target VolumeReplication becomes primary. The driver tells the array to make the local replica the source. From that moment the target accepts writes and the old source becomes the replica."
  - id: "6.7"
    chapter: "The replication layer"
    visual: "Job history ticks, one missing tick highlighted."
    narration: "Before you trust a recovery, check the last completed sync of every disk. A session can be healthy while one disk skipped a scheduled sync. The gate is the job history, not the green badge."
  - id: "6.8"
    chapter: "The replication layer"
    visual: "Recap: per volume, async, promote, reprotect."
    narration: "So replication is per volume, asynchronous, and bounded by the schedule. Promotion flips the direction, and reprotection sets it back after recovery."
    pause_after: 1.2

  - id: "7.1"
    chapter: "The orchestration layer"
    visual: "Hub region highlighted."
    narration: "Someone has to decide which cluster runs the app, promote the right disks, restore the right objects, and clean up the old site. That is the orchestration layer."
  - id: "7.2"
    chapter: "The orchestration layer"
    visual: "ACM hub card with two spokes."
    narration: "The hub runs ACM and the Ramen operators. It does not run the workload. It holds the policy, the per-app request, the placement, and the connection to both spokes."
  - id: "7.3"
    chapter: "The orchestration layer"
    visual: "DRPolicy and DRCluster cards."
    narration: "A DRPolicy pairs spoke zero and spoke one with a fifteen minute interval. A DRCluster object represents each spoke and validates that it can reach the S3 store and its storage."
  - id: "7.4"
    chapter: "The orchestration layer"
    visual: "DRPC card with policy, placement, selector, action."
    narration: "The DRPC is the per-app request. It names the policy, the placement, and the PVC label selector. It also carries the action, Failover or Relocate, and the target cluster."
  - id: "7.5"
    chapter: "The orchestration layer"
    visual: "Placement to PlacementDecision with a selected cluster."
    narration: "Ramen drives ACM Placement. It writes a PlacementDecision that names the active cluster, and it keeps the old cluster as a retained decision during failover. Argo CD and the workload follow that decision."
  - id: "7.6"
    chapter: "The orchestration layer"
    visual: "ManifestWork envelope from hub to spoke, status back."
    narration: "The hub cannot apply resources directly to a spoke. It writes a ManifestWork. The spoke agent applies the VRG locally, and the hub reads status back through a ManagedClusterView."
  - id: "7.7"
    chapter: "The orchestration layer"
    visual: "S3 bucket with PV and PVC documents."
    narration: "The S3 bucket holds the PV and PVC definitions for every protected volume. On the target, Ramen reads them and recreates the claim against the promoted array volume."
  - id: "7.8"
    chapter: "The orchestration layer"
    visual: "DRPC state ladder: Deployed, FailingOver, FailedOver, with progression steps."
    narration: "The DRPC has a phase and a progression. Phase goes Deployed, FailingOver, FailedOver. Progression goes through prerequisites, promotion, resource restore, readiness, placement update, cleaning up, and completed."
  - id: "7.9"
    chapter: "The orchestration layer"
    visual: "Recap: hub decides, envelope delivers, VRG acts, S3 supplies."
    narration: "So the hub decides, the ManifestWork delivers, the VRG acts on the spoke, and S3 supplies the missing Kubernetes objects."
    pause_after: 1.2

  - id: "8.1"
    chapter: "Failover walkthrough"
    visual: "Wide world, DRPC and target spoke highlighted."
    narration: "Now put the pieces in order. This is a generic walkthrough, using the states recorded in this lab. The direction in the recorded runs was a move to the home cluster, spoke zero."
  - id: "8.2"
    chapter: "Failover walkthrough"
    visual: "Console action: Failover, target selected."
    narration: "An operator selects Failover in the hub console and chooses the target. The console sets the action and the failover cluster on the DRPC. Nothing has moved yet."
  - id: "8.3"
    chapter: "Failover walkthrough"
    visual: "Prerequisite checks; old cluster retained."
    narration: "Ramen checks the target VRG, the policy, and the peer. It retains the old cluster in the placement decision so the application is not scheduled there again."
  - id: "8.4"
    chapter: "Failover walkthrough"
    visual: "Target VRG primary, VR promoted, array role flips."
    narration: "The target VRG becomes primary. Each VolumeReplication is promoted, and the array makes the target replica writable. This is the point of no return for the old copy."
  - id: "8.5"
    chapter: "Failover walkthrough"
    visual: "S3 documents flow into PV and PVC on target."
    narration: "The VRG restores the PV and PVC definitions from S3 and rewrites the volume handle to the promoted replica. Then OADP restores the VM, DataVolumes, Service, and Secret."
  - id: "8.6"
    chapter: "Failover walkthrough"
    visual: "PlacementDecision update, ApplicationSet, Application."
    narration: "Ramen updates the PlacementDecision. For a managed app, the ApplicationSet generator sees the new decision and creates an Application for the target cluster. Argo CD syncs it."
  - id: "8.7"
    chapter: "Failover walkthrough"
    visual: "VM boots, guest services start, first write."
    narration: "The VM starts on the target. The guest sees the same disks, replays its journal, and starts its services. The first successful write is the real proof that recovery worked."
  - id: "8.8"
    chapter: "Failover walkthrough"
    visual: "WaitOnUserToCleanUp banner on a discovered app."
    define:
      term: "WaitOnUserToCleanUp"
      text: "Ramen has recovered the target but will not delete a discovered source application. An administrator must remove it."
    narration: "If the application was discovered, Ramen waits at Wait On User To Clean Up. An administrator must remove the source VM and its DataVolumes before the source VRG can become secondary."
  - id: "8.9"
    chapter: "Failover walkthrough"
    visual: "Screenshot: DRPC details."
    screenshot: "12-drpc-details.png"
    focus: {x: 330, y: 300, w: 900, h: 420}
    caption: "A recorded managed-app DRPC: FailedOver, progression Completed, peer ready true, recorded duration 5m 41s."
    narration: "This recorded managed app DRPC shows the end state. Failed Over, progression Completed, peer ready true. The recorded duration from start to completion was five minutes and forty one seconds."
  - id: "8.10"
    chapter: "Failover walkthrough"
    visual: "Recovered rows versus last sync line."
    narration: "The data verdict is separate. Compare the recovered rows with the last sync before the initiate time. A completed DRPC proves the platform moved the app. It does not prove zero data loss."
  - id: "8.11"
    chapter: "Failover walkthrough"
    visual: "Recap ladder: promote, restore, place, boot, clean, measure."
    narration: "So failover is promote, restore, place, boot, clean up, and then measure. Each step has a different owner and a different failure mode."
    pause_after: 1.4

  - id: "9.1"
    chapter: "Managed GitOps apps"
    visual: "Two lanes: discovered app and managed app."
    narration: "There are two application models, and mixing them is the most common mistake. A discovered app is protected in place. A managed app is deployed from Git by Argo CD."
  - id: "9.2"
    chapter: "Managed GitOps apps"
    visual: "ApplicationSet reads PlacementDecision, generates Application."
    narration: "For a managed app the hub runs an ApplicationSet in pull mode. The generator reads the PlacementDecision and renders one Application for the selected cluster."
  - id: "9.3"
    chapter: "Managed GitOps apps"
    visual: "Screenshot: ApplicationSet topology."
    screenshot: "11-appset-topology.png"
    focus: {x: 640, y: 690, w: 880, h: 320}
    caption: "Generated Application topology: ApplicationSet, Placement, decision, then the VM, DataVolumes, PVCs, PVs, Service, and Secret."
    narration: "Here is the generated topology. The ApplicationSet reads the Placement, the decision selects a cluster, and the Application fans out to the VM, DataVolumes, PVCs, PVs, Service, and Secret."
  - id: "9.4"
    chapter: "Managed GitOps apps"
    visual: "Namespace box openshift-gitops contains DRPC, Placement, ApplicationSet."
    narration: "The DRPC and the Placement must live in the same namespace as Argo CD, openshift gitops. Ramen writes the decision there, and the generator only reads decisions from its own namespace."
  - id: "9.5"
    chapter: "Managed GitOps apps"
    visual: "PVC selector drprotection=true, no protectedNamespaces."
    narration: "The managed DRPC uses a PVC selector, DR protection equals true, and it does not set protectedNamespaces. Ramen owns the app, so it can clean it up on the source."
  - id: "9.6"
    chapter: "Managed GitOps apps"
    visual: "Git path without a Namespace manifest; prune warning."
    narration: "The Git path must not contain a Namespace manifest. If Argo CD owns the namespace, pruning the source can delete the namespace and the VRG before the array has demoted it."
  - id: "9.7"
    chapter: "Managed GitOps apps"
    visual: "Recap: decision drives ApplicationSet, Argo rebuilds."
    narration: "So managed apps add a GitOps loop. The placement decision drives the ApplicationSet, and Argo CD rebuilds the workload on the promoted disks."
    pause_after: 1.2

  - id: "10.1"
    chapter: "Zerto versus this model"
    visual: "Split screen: VMware hypervisor stack and OpenShift pod stack."
    narration: "Zerto works today in a VMware world. The question is what changes when the VM is a pod. The answer is the layer where you can see the writes."
  - id: "10.2"
    chapter: "Zerto versus this model"
    visual: "ESXi host with VRA and VM disk."
    narration: "In vSphere, the hypervisor owns the virtual disk and the device state. Zerto installs a virtual replication appliance on each host and sees the write stream at that layer."
  - id: "10.3"
    chapter: "Zerto versus this model"
    visual: "Journal on the target with 5 to 15 second checkpoints."
    narration: "Zerto keeps a per VM journal on the target. It advertises near synchronous replication, RPOs of seconds, and recovery to a point in time inside the journal window."
  - id: "10.4"
    chapter: "Zerto versus this model"
    visual: "OpenShift stack: pod, QEMU, CSI volume, API object."
    narration: "On OpenShift Virtualization there is no host hypervisor to hook. QEMU runs inside a pod, the disk is a CSI volume, and the VM definition is an API object."
  - id: "10.5"
    chapter: "Zerto versus this model"
    visual: "Comparison table appears row by row."
    narration: "So the integration points move. Instead of a VRA on an ESXi host, you need a KubeVirt aware controller, a CSI plugin or snapshot path, and a metadata store."
  - id: "10.6"
    chapter: "Zerto versus this model"
    visual: "RPO scale: seconds, minutes, hours."
    narration: "The RPO also changes shape. Array replication gives minutes. A journal in the data path can give seconds, but it must capture writes from QEMU or from inside the guest."
  - id: "10.7"
    chapter: "Zerto versus this model"
    visual: "Concept mapping: VPG to DRPC, consistency group to VRG, test failover to dry run."
    narration: "The parts that carry over are the concepts. A consistency group becomes a VRG. A VPG becomes a DRPC. A test failover becomes a dry run, and a move becomes a Relocate."
  - id: "10.8"
    chapter: "Zerto versus this model"
    visual: "Two journal placement options: CSI layer and guest agent."
    narration: "A journal could sit between the CSI driver and the array, or in a guest agent. The first sees block writes, the second sees application writes. Each has a different consistency and deployment cost."
  - id: "10.9"
    chapter: "Zerto versus this model"
    visual: "Recap: port the guarantees, not the architecture."
    narration: "So do not port the VMware architecture. Port the guarantees, and rebuild them against KubeVirt, CSI, and the Kubernetes API."
    pause_after: 1.4

  - id: "11.1"
    chapter: "A blueprint for Zerto"
    visual: "Blueprint panel with seven steps."
    narration: "Here is a practical blueprint. It is a design checklist, not a claim that Zerto supports this today."
  - id: "11.2"
    chapter: "A blueprint for Zerto"
    visual: "Step 1: discovery of VM, VMI, DataVolume, PVC, Application."
    narration: "First, discover the workload. Watch VirtualMachine, VirtualMachineInstance, DataVolume, PVC, and the owning Application. Map each VM to its disks and its namespace."
  - id: "11.3"
    chapter: "A blueprint for Zerto"
    visual: "Step 2: three data path choices."
    narration: "Second, choose the data path. Use CSI snapshots for point in time copies, CSI replication for continuous copies, or a data path component if you need a journal."
  - id: "11.4"
    chapter: "A blueprint for Zerto"
    visual: "Step 3: metadata store with VM spec, PVC, PV, Service, Secret references."
    narration: "Third, store metadata outside the cluster. Keep the VM spec, the PVC and PV definitions, the Service, and references to Secrets. Never copy Secret values into Git."
  - id: "11.5"
    chapter: "A blueprint for Zerto"
    visual: "Step 4: orchestration with ACM Placement and DRPC-like object."
    narration: "Fourth, orchestrate placement. Use ACM Placement and a DRPC like object, or integrate with Ramen. The controller must promote disks before it starts the VM."
  - id: "11.6"
    chapter: "A blueprint for Zerto"
    visual: "Step 5: ordered restore ladder."
    narration: "Fifth, fix the restore order. Promote the disk, recreate the PV and PVC, restore the objects, create the namespace, then start the VM. Starting early produces a blank disk or a pending pod."
  - id: "11.7"
    chapter: "A blueprint for Zerto"
    visual: "Step 6: freeze and unfreeze, DNS re-point."
    narration: "Sixth, handle the guest and the network. Freeze and unfreeze for consistency, re-IP or re DNS on the target, and verify that the database and the workload start without a human."
  - id: "11.8"
    chapter: "A blueprint for Zerto"
    visual: "Step 7: test plan with sync age, test failover, recovered rows, reverse path."
    narration: "Seventh, test the guarantees. Measure the last sync before initiate, run a test failover, verify the recovered rows, and then test the cleanup and the reverse replication."
  - id: "11.9"
    chapter: "A blueprint for Zerto"
    visual: "Pitfall cards: RWO, cleanup order, finalizer, skipped sync."
    narration: "The lab's hard lessons: RWO disks cannot live migrate, source cleanup order matters, a stuck finalizer can block the VRG, and a green status can hide a skipped sync."
  - id: "11.10"
    chapter: "A blueprint for Zerto"
    visual: "Recap of the seven steps."
    narration: "So the blueprint is discover, copy, store metadata, place, restore in order, validate the guest, and test the reverse path."
    pause_after: 1.4

  - id: "12.1"
    chapter: "Recap and readiness"
    visual: "Whole chain replay."
    narration: "The whole chain in one sentence. A VM is a pod with a disk. The array replicates the disk. Ramen stores the objects and moves the placement. Argo CD or the restore path rebuilds the workload."
  - id: "12.2"
    chapter: "Recap and readiness"
    visual: "Four role cards: array, Ramen, Argo, guest."
    narration: "Keep the roles separate. The array guarantees the blocks. Ramen guarantees the DR metadata and the decision. Argo CD guarantees the desired state. The guest guarantees its own recovery."
  - id: "12.3"
    chapter: "Recap and readiness"
    visual: "Readiness checklist."
    narration: "A readiness checklist: policy validated, both clusters reachable, every disk synced within RPO, the writer running, the baseline captured, and the target capacity reserved."
  - id: "12.4"
    chapter: "Recap and readiness"
    visual: "Three measurements: RPO, RTO, data loss."
    narration: "Measure RPO from the last completed sync, RTO from the click to the first successful write, and data loss from the recovered rows. Do not measure either from a green badge."
  - id: "12.5"
    chapter: "Recap and readiness"
    visual: "Closing card."
    narration: "That is the model to explain to the Zerto team. OpenShift Virtualization gives you VMs as Kubernetes objects, and DR is a chain of storage, metadata, placement, and guest recovery."
    pause_after: 2.0
