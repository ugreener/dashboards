  - id: "3.2"
    chapter: The request
    visual: The DRPC card. Action Failover and failoverCluster spoke-0 appear; the target VRG turns Primary.
    narration: >-
      Clicking Initiate wrote two fields on the hub DRPC: action Failover, and
      failoverCluster spoke-0. The console is only the front door. Ramen's DRPC controller
      validates the target, marks the phase FailingOver, and requests the target VRG as
      Primary through a ManifestWork. Later, after the old application is cleaned up, the
      source VRG is told to become Secondary.
    evidence: hub-state.txt spec.action Failover and spec.failoverCluster spoke-0
    pause_after: 1.0

  - id: "3.3"
    chapter: The request
    visual: >-
      A phase strip: FailingOver at 07:22:34, WaitingForResourceRestore, FailedOver at 07:22:48, Cleaning Up.
    narration: >-
      The run recorded the transition. At zero seven twenty-two thirty-four the DRPC was
      FailingOver with progression WaitingForResourceRestore. At zero seven twenty-two
      forty-eight it was FailedOver with progression Cleaning Up. The phase changed while
      the storage and object work were still in progress.
    evidence: run log failover timeline; DRPC actionStartTime 07:22:21Z
    pause_after: 1.0

  - id: "3.4"
    chapter: The request
    visual: Both sites stay bright and reachable. No suspended node, no lost heartbeat, no powered-off array.
    narration: >-
      Notice what did not happen. This run did not suspend the source, did not power off
      an array, and did not wait for a lost heartbeat. This is a reachable-source
      failover. The hard part is not surviving a dead site. It is switching two live sites
      without letting both sides write.
    evidence: VIRTDR-498 ticket scope, both sites reachable; no suspension in run log
    pause_after: 1.2

  - id: "4.1"
    chapter: Promotion
    visual: The S3 bucket sends the archived VM, Secret, claims and group manifest to spoke-0.
    narration: >-
      On the target, Velero restored the VM and its Secret from the S3 archive. Ramen's
      own restore path rebuilt the claims and the group manifest on spoke-0. The archived
      VGRC is the map. Its group handle and disk handles still described the old
      direction, so Ramen rewrote them to the destination side.
    evidence: target VGRC object; Ramen vrg_volgrouprep.go cleanupVGRCForRestore
    pause_after: 1.0

  - id: "4.2"
    chapter: Promotion
    visual: The restored group map panel. The handle 5f195dc9 and the two promoted VSA-A handles appear.
    narration: >-
      The restored VGRC is the target group content, and the panel shows its exact name.
      Its group handle became the group that was the Destination before the move. The
      panel also shows the new destination group the reverse copy will use. The disk
      mapping points at the promoted VSA-A handles. The VGR and companion
      VolumeReplication were created in namespace hammerdb.
    evidence: VGRC object, spoke-0 must-gather 2026-11-22T08:26Z
    pause_after: 1.2

  - id: "4.3"
    chapter: Promotion
    visual: The companion VR asks for Primary, csi-addons calls PromoteVolume, and the driver selects the group.
    narration: >-
      The target VRG's Primary request drove the VGR, and the VGR's companion
      VolumeReplication asked for Primary. csi-addons called the Dell driver's
      PromoteVolume. The driver did not promote one disk at a time. It found the volume
      group ID and issued one failover for the group session, the same session that
      covered both disks.
    evidence: VR object spec.replicationState primary; csiaddons_replication.go promoteVolumeForVolumeGroup
    pause_after: 1.2

  - id: "4.4"
    chapter: Promotion
    visual: One array action on the group. Both disks change role together; no half-promoted state.
    narration: >-
      That one group action is the guarantee. The array changed the role of the group, so
      both disks became writable on VSA-A together. There is no per-disk promotion step
      in this path. The VGR status recorded the result: volume group promoted to primary
      and replicating to secondary.
    evidence: VGR status message and Completed reason Promoted; array screenshots 11 and 12
    pause_after: 1.6

  - id: "4.5"
    chapter: Promotion
    visual: Both target claims bind to their promoted handles. The old-site copies stay as the new destination.
    narration: >-
      The target claims bound through two PVs: csivol-31136f5c90 for the root claim, and
      csivol-2a761d921f for the data claim. Each PV's spec.csi.volumeHandle points at a
      promoted VSA-A disk, and the panel shows both exact handles. The old-site copies
      stayed on VSA-B as the new destination. No target claim was left pointing at a
      stale handle.
    evidence: spoke-0 PV list; VGRC persistentVolumeMappingList
    pause_after: 1.4

  - id: "4.6"
    chapter: Promotion
    visual: The target VM starts. The VMI is Running, PostgreSQL and the writer come back.
    narration: >-
      The VM then came back on spoke-0. The target VMI was Running. PostgreSQL started,
      and the HammerDB writer was active again. By zero seven twenty-four forty-seven the
      guest was writing. The target recovered while the old site was still up, before the
      source cleanup.
    evidence: postcheck target VMI Running; run index 07:24:47 order total 10,339,193
    pause_after: 1.2

  - id: "4.7"
    chapter: Promotion
    visual: The console shows FailedOver, 3 of 4 steps, cleanup pending.
    narration: >-
      The DRPC reached FailedOver, and the PlacementDecision named spoke-0 by zero seven
      thirty-seven. The application was serving from the recovery site. The group had done
      what a group is for: one role change, both disks, one application. The console
      capture still showed the fourth step, cleanup, as pending.
    evidence: run index final state; 08-failedover-cleaningup.png
    screenshot: 08-failedover-cleaningup.png
    focus: {x: 960, y: 160, w: 345, h: 460}
    caption: FailedOver, 3 of 4 steps, cleanup pending, captured 07:46 UTC
    pause_after: 1.2

  - id: "4.8"
    chapter: Promotion
    visual: Recap panel. The request, the restore, the one promote call, the guest, and the pending cleanup.
    narration: >-
      So far: the request moved the placement, the archive rebuilt the objects, one
      promote call flipped the group, and the guest returned. The old site still held the
      original copies. The cleanup was still pending. What happened to the data in the
      gap?
    evidence: VIRTDR-498 run log; DRPC conditions; target VMI
    pause_after: 1.2

  - id: "5.1"
    chapter: Data
    visual: >-
      Two postcheck cards: 15 of 17 at 07:46, 17 of 17 at 07:53.
    narration: >-
      The first postcheck failed two handle checks. The final postcheck passed seventeen
      of seventeen. This video uses the final result and keeps the first result in the
      record. The archive does not contain the checker change, so the reason for the
      difference is not established here.
    evidence: postcheck-20261122T074620Z.json 15/17; postcheck-20261122T075337Z.json 17/17
    pause_after: 1.2

  - id: "5.2"
    chapter: Data
    visual: >-
      A timeline: sync job completed 07:21:09, snapshot contains writes only to 07:19:26, Initiate 07:22:21.
    narration: >-
      The check compared two clocks. At Initiate, the last completed group sync was zero
      seven twenty-one oh nine, and the checker reported its age as seventy-one seconds.
      But the last recovered source write was zero seven nineteen twenty-six. The job
      finished at twenty-one oh nine. The recovered rows end at nineteen twenty-six. A
      completed job is not the same as a fresh snapshot.
    evidence: >-
      postcheck results: last sync 07:21:09, last source row 07:19:26
    pause_after: 1.4

  - id: "5.3"
    chapter: Data
    visual: >-
      The measured window: 175 seconds of lost writes, 25 complete source minutes recovered, 900-second policy.
    narration: >-
      The loss window starts at the last recovered write, not at the job completion.
      Writes between zero seven nineteen twenty-six and the zero seven twenty-two
      twenty-one Initiate were not in the copy: one hundred seventy-five seconds. The
      policy allows nine hundred. The check also walked twenty-five complete source
      minutes before the last sync and found no missing rows.
    evidence: >-
      postcheck data loss within RPO: 175 s; 25 complete source minutes, missing none
    pause_after: 1.6

  - id: "5.4"
    chapter: Data
    visual: >-
      Verdict card: complete to 07:19:26, 175 seconds lost, within the 900-second RPO, not zero loss.
    narration: >-
      So the verdict is narrow and honest. The check found no missing rows in the
      twenty-five complete source minutes it walked, and one hundred seventy-five seconds
      of writes after the last recovered row are lost. That is inside the RPO. It is not
      zero loss, and it is not a claim about every write the database ever accepted.
    evidence: postcheck verdict; RPO 900 s; 175 s measured
    pause_after: 1.4

  - id: "6.1"
    chapter: Reverse copy
