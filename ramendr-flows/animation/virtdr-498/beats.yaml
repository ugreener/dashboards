  - id: "3.1"
    chapter: The request
    visual: The Failover dialog, with target spoke-0 and the cleanup warning.
    narration: >-
      The Failover dialog named target cluster spoke-0. Failover readiness was Ready, and
      the volume last-synced value was zero seven oh nine. The dialog also warned that the
      old application must be cleaned up manually before replication can begin. That
      warning matters later, because the console's fourth step and the array's copy are not
