  - id: "2.5"
    chapter: Protection
    visual: A deadline bar from the last completed sync to the Initiate, with the actual click marked inside it.
    narration: >-
      This is the gate that matters. The writer was advancing, the copy was carrying real
      rows, and the last completed sync still left time to act. At zero seven twenty-two
      twenty-one the operator clicked Initiate, forty-nine seconds before the deadline.
      The test did not begin with a stale copy.
    evidence: preflight deadline 2026-11-22T07:23:10Z; Initiate 07:22:21Z; run log
