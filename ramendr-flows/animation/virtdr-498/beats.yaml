      reported storage health true at zero seven twenty-three oh seven. By zero seven
      twenty-seven fifty-six the array session showed VSA-A Source and VSA-B Destination,
      copying from the new primary back to the old site.
    evidence: 11-vsa-a-post-failover.png; DRPC ReplicationHealthy 07:23:07Z; run index 07:27:56
    screenshot: 11-vsa-a-post-failover.png
    focus: {x: 18, y: 430, w: 900, h: 40}
