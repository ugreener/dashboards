# yamllint disable rule:line-length
ticket: VIRTDR-498
run: 2026-11-22
direction: spoke-1 to spoke-0 failover, VSA-B to VSA-A, both sites reachable
beats:
  - id: "0.1"
    chapter: Cold open
    visual: Wide dark frame, two site bands and a single writing database. The title "Two disks, one handover" fades in.
    narration: >-
      Two sites. One database, writing. The operator asks the other site to take over
      while both sites are still healthy. The two disks must switch together. A database
      that wakes with one disk from one moment and one disk from another is not
      recovered. This ticket records that grouped handover.
    evidence: VIRTDR-498 ticket description, scope and environment
    pause_after: 1.6

  - id: "0.2"
    chapter: Cold open
    visual: Outcome card. "175 s outside the copy" and "900 s policy" appear, then "one cleanup defect".
    narration: >-
      The handover worked. The database came back with a measured gap of one hundred
      seventy-five seconds, inside a fifteen-minute policy. Then the cleanup left two
      disk records stuck deleting. This video follows the recorded run, the measured
      data, and the defect it exposed.
    evidence: VIRTDR-498 run log 2026-11-22T07:53:37Z, postcheck results
    pause_after: 1.2

  - id: "1.1"
    chapter: The pieces
    visual: Two site cards, a hub card, and two array strips. The workload sits on the old site.
    narration: >-
      Start with the floor plan. Two OpenShift clusters, called spokes, each on its own
      machine. spoke-1 on ocp-edge97 is the old site. spoke-0 on ocp-edge95 is the
      recovery site. A third cluster, the hub on ocp-edge36, holds the control records.
      Each spoke has one Dell PowerStore array: VSA-B at the old site, VSA-A at the
      recovery site.
    evidence: VIRTDR-498 ticket environment; run log configuration
    pause_after: 1.0

  - id: "1.2"
    chapter: The pieces
    visual: The guest card on the old site, with its two disks and the VMI beside it.
    narration: >-
      The application is one RHEL 9 virtual machine named hammerdb-rhel9, in namespace
      hammerdb. PostgreSQL holds a TPC-C database, and a HammerDB writer keeps it busy. It
      is a discovered application: an existing workload selected for protection, not an
      Argo CD ApplicationSet. OpenShift Virtualization runs it as a VirtualMachineInstance,
      or VMI. Each disk is prepared by a DataVolume.
    evidence: VIRTDR-498 ticket environment; run log configuration
    pause_after: 1.0

  - id: "1.3"
    chapter: The pieces
    visual: Two claim cards beside the guest, one for the root disk and one for the data disk.
    narration: >-
      The guest sees two disks, and Kubernetes sees two requests for storage, called
      PersistentVolumeClaims, or claims. The root claim is hammerdb-rhel9-rootdisk-grp.
      The data claim is hammerdb-rhel9-datadisk-grp. A claim does not point at a disk
      directly. Kubernetes binds it to a PersistentVolume.
    evidence: hub-state.txt spec.pvcSelector; run log configuration
    pause_after: 1.0

  - id: "1.4"
    chapter: The pieces
    visual: Glossary card for the root PV, with the volume handle and the array identity.
    narration: >-
      The PersistentVolume is the record that names the real disk. It carries a volume
      handle, the array's disk identifier plus its array and protocol. Keeping that record
      correct is as important as copying the bytes. The target root PV is
      csivol-31136f5c90, and the data PV is csivol-2a761d921f.
    evidence: spoke-0 PV list; spoke-1 PV list, reclaim evidence
    card:
      kind: PersistentVolume
      name: csivol-31136f5c90
      role: the record that binds the claim to the real disk
    def:
      what: The cluster record for one bound disk.
      creator: The CSI provisioner creates it when the claim binds.
      reader: The claim, the CSI driver, and Ramen's restore path.
      where: Cluster scope on the spoke.
      analogy: The deed that names the actual storage behind the request.
    pause_after: 1.0

  - id: "1.5"
    chapter: The pieces
    visual: Glossary card for the DRPC, with the Placement and PlacementDecision beside it.
    narration: >-
      The hub record for the application is the DRPlacementControl, or DRPC, named
      hammerdb-drpc. It names the policy, the claims, and the namespaces it protects. It
      points at a Placement named hammerdb-placement, and a PlacementDecision named
      hammerdb-placement-decision-1 records the chosen cluster.
    evidence: hub-state.txt spec; spoke-0 DRPC object
    card:
      kind: DRPlacementControl
      name: hammerdb-drpc
      role: the hub record for this application
    def:
      what: The hub control record for one protected application.
      creator: An administrator enrolls the application, or the console creates it.
      reader: Ramen's hub controller, the console, and the DR dashboard.
      where: Hub cluster, namespace openshift-dr-ops.
      analogy: The work order that says which site should run the application.
    pause_after: 1.0

  - id: "1.6"
    chapter: The pieces
    visual: Glossary card for the DRPolicy, with the two clusters and the 900-second objective.
    narration: >-
      The policy is dr-policy-15m. It pairs spoke-0 and spoke-1 and sets a recovery point
      objective of nine hundred seconds. The recovery point objective, or RPO, is the
      most data the business accepts losing. It is a limit, not a promise that the copy
      is fresh. Something has to prove the copy.
    evidence: run log configuration, DRPolicy dr-policy-15m, RPO 900 s
    card:
      kind: DRPolicy
      name: dr-policy-15m
      role: pairs the sites and sets the 15-minute objective
    def:
      what: A pair of clusters and a replication schedule that sets the RPO.
      creator: A disaster recovery administrator.
      reader: The DRPC and the VRG on each site.
      where: Hub cluster, cluster scope.
      analogy: The contract that says how much data the business accepts losing.
    pause_after: 1.2

  - id: "1.7"
    chapter: The pieces
    visual: Glossary card for the VRG, with one card on each spoke.
    narration: >-
      Each site has a VolumeReplicationGroup, or VRG. It is the site's coordinator. It
      selects the claims, creates the replication objects, and reports whether this site
      is primary or secondary. Both VRGs are named hammerdb-drpc in namespace
      openshift-dr-ops. Ramen, the disaster recovery controller, delivers them from the
      hub.
    evidence: source VRG object, spoke-1 must-gather 2026-11-22T08:26Z
    card:
      kind: VolumeReplicationGroup
      name: hammerdb-drpc
      role: coordinates protection on each site
    def:
      what: The per-site coordinator for the protected claims.
      creator: Ramen's hub controller delivers it as a ManifestWork.
      reader: Ramen's spoke controller, the DRPC, and the console.
      where: Each spoke, namespace openshift-dr-ops.
      analogy: The site foreman who knows which disks are protected.
    pause_after: 1.0

  - id: "1.8"
    chapter: The pieces
    visual: Glossary card for the VGR, with the two claims inside one outline.
    narration: >-
      The group object is the VolumeGroupReplication, or VGR, in namespace hammerdb. It
      selects both claims with two labels: appname equals hammerdb-rhel9-grp, and the
      consistency-group label that names the group. That group label is the identity. It
      tells csi-addons that these two claims are copied and promoted as one unit, not as
      two independent disks.
    evidence: VGR object, hammerdb must-gather 2026-11-22T08:26Z; VGRC spec
    card:
      kind: VolumeGroupReplication
      name: vgr-4251c970ec7af885d6ec79c1d2c40661-hammerdb-drpc
      role: one request for the whole group
    def:
      what: One replication request for every claim that carries the group labels.
      creator: The VRG on the site that is primary.
      reader: csi-addons, which creates the group content and companion record.
      where: Namespace hammerdb on each spoke.
      analogy: One shipping container instead of two separate parcels.
    pause_after: 1.2

  - id: "1.9"
    chapter: The pieces
    visual: Glossary card for the VGRC and the companion VolumeReplication.
    narration: >-
      csi-addons turns the VGR into two more objects. The VolumeGroupReplicationContent,
      or VGRC, records the array's group handle and the mapping from each disk to its
      copy. The companion VolumeReplication carries the state machine. The VGRC is
      cluster scoped. The companion VR is in namespace hammerdb. Both names use the
      VGR's UID, not its name, and the card shows the exact target names.
    evidence: VGRC and VR objects, spoke-0 must-gather 2026-11-22T08:26Z
    card:
      kind: VolumeGroupReplicationContent
      name: vgrcontent-c20d5ca2-e01a-4a9a-aade-789ab83b5f2d
      role: the map of the group and its disks
    def:
      what: The group manifest, with the array group handle and the disk mapping.
      creator: csi-addons, from the VGR.
      reader: The Dell CSI driver and Ramen's restore path.
      where: Cluster scope on the site that owns the group.
      analogy: The packing list that says which box holds which item.
    pause_after: 1.2

  - id: "1.10"
    chapter: The pieces
    visual: One array session on each side, roles Source and Destination, a 15-minute clock, and the legend.
    narration: >-
      On the arrays, the group is one replication session. Before the test, VSA-B was the
      Source and VSA-A was the Destination. The policy sets a fifteen-minute schedule. A
      session has a role, a state, and a last sync time. The role says which side is
      writable now. The state says whether the copy is healthy.
    evidence: VGRC volumeGroupAttributes; group handle 5f195dc9-650e-4051-81fd-9f99f7dcc86d; preflight session e16423f4-919e-452b-9651-7744ffb02f8f
    pause_after: 1.0

  - id: "1.11"
    chapter: The pieces
    visual: >-
      Two paths side by side: Failover, crash-consistent, stops at the last copy;
      Relocate, planned, flushes first.
    narration: >-
      One last distinction. Failover is the crash-consistent action. It stops at the last
      completed copy, and writes after it are lost. Relocate is the planned move. It is
      designed to flush first and avoid that loss. This run used Failover, with both sites
      reachable.
    evidence: VIRTDR-498 ticket scope; DRPC action Failover
    pause_after: 1.2

  - id: "1.12"
    chapter: The pieces
    visual: >-
      Recap panel. "Two claims. One group. One session. Two questions: is the copy fresh,
      is the peer ready?"
    narration: >-
      So far: two sites, two claims, one group, and one array session. The group is the
      promise that both disks share a role and a recovery point. But a group does not
      prove the copy is fresh, and it does not prove the old site is ready to be a peer.
      Those are the next two questions.
    evidence: VIRTDR-498 run log configuration; VGRC mapping
    pause_after: 1.2
