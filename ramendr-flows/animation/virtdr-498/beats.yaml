    pause_after: 1.2

  - id: "6.2"
    chapter: Reverse copy
    visual: >-
      The VGR status panel: Primary, Replicating true, autoResync false.
    narration: >-
      The VGR records it on the Kubernetes side. Its status was Primary, with Replicating
      true and the message volume group is promoted to primary and replicating to
      secondary. The target VGR's autoResync field was false, which is expected for a
      Primary VGR. The observed session is the evidence for the reverse copy. Which side
      issued a separate Reprotect is not recorded.
    evidence: VGR object, spoke-0 must-gather 2026-11-22T08:26Z; driver promoteVolumeForVolumeGroup
    unverified: The exact controller that issued a separate Reprotect is not recorded. The array state is the evidence for the reverse copy, not the autoResync field.
    pause_after: 1.4

  - id: "6.3"
    chapter: Reverse copy
    visual: The VSA-B replication table, highlighting the same group as Destination.
    narration: >-
      The pair of array views shows the same group from both sides. VSA-A now lists it as
      Source, and VSA-B lists it as Destination. The last sync times moved forward. The
      two views agree on the direction of the hammerdb group.
    evidence: 12-vsa-b-post-failover.png; 11-vsa-a-post-failover.png
    screenshot: 12-vsa-b-post-failover.png
    focus: {x: 18, y: 430, w: 900, h: 40}
    caption: After failover, VSA-B lists the group as Destination, array time UTC+02:00
    pause_after: 1.2

  - id: "6.4"
    chapter: Reverse copy
    visual: The healthy DR status popover, with PVC last synced 07:27 and Kubernetes resources 07:36.
    narration: >-
      Peer readiness came later. The DRPC's PeerReady condition turned true at zero seven
      thirty-five oh four, the source VRG reported Secondary at about zero seven
      thirty-five, and the DRPC reached Completed at zero seven thirty-seven. The console's
      fourth step, cleanup, lines up with that peer state, not with the storage copy.
    evidence: 10-completed-expanded.png; source VRG state Secondary; DRPC PeerReady 07:35:04Z
    screenshot: 10-completed-expanded.png
    focus: {x: 900, y: 250, w: 470, h: 270}
    caption: After cleanup, healthy, PVCs last synced 07:27 UTC
    pause_after: 1.4

  - id: "6.5"
    chapter: Reverse copy
    visual: >-
      Two questions side by side: Is the array copy healthy? Is the old site a ready peer?
    narration: >-
      This is the distinction to keep. Replicating true answers whether the array copy is
      healthy. PeerReady answers whether the old site has finished its role change. A run
      can have the first without the second. In this run, it did, for about twelve minutes.
    evidence: ReplicationHealthy 07:23:07Z vs PeerReady 07:35:04Z
    pause_after: 1.4

  - id: "7.1"
    chapter: Cleanup
    visual: The source VM, DataVolumes and claims are deleted. The source VRG becomes Secondary.
    narration: >-
      Source cleanup is a separate step for a discovered application. At zero seven
      thirty-three the old VM was deleted. At zero seven thirty-five its DataVolumes and
      remaining claims were deleted. The source VRG then became Secondary. That is the
      normal path, and it is where the defect appeared.
    evidence: run index cleanup 07:33/07:35; source VRG state Secondary
    pause_after: 1.2

  - id: "7.2"
    chapter: Cleanup
    visual: Two old-site PV cards with Retain and the vr-retained annotation.
    narration: >-
      The old-site PVs were supposed to keep a retention annotation and a reclaim policy
      of Retain. That is deliberate. The PV must not ask the array to delete a disk that is
      still the live copy target. The two PVs are csivol-31136f5c90 and
      csivol-2a761d921f. When the claims were deleted, Ramen's VRG controller ran
      preparePVCForVRDeletion.
    evidence: reclaim evidence spoke1-state.txt; Ramen vrg_volrep.go preparePVCForVRDeletion
    pause_after: 1.2

  - id: "7.3"
    chapter: Cleanup
    visual: >-
      The code branch: async VRG or Primary leads to undoPVRetention, which sets Delete and removes vr-retained.
    narration: >-
      The code treats an async VRG, or one already in Primary, as the undo case and calls
      undoPVRetention. That sets the PV reclaim policy back to Delete and removes the
      retention annotation. This code path explains the observed change while the old site
      was still the replication destination. The PV controller then asked the Dell driver
      to delete the volume.
    evidence: vrg_volrep.go:615 condition, :616 undo, :737 body; DFBUGS-12906
    unverified: The code path is verified in upstream main. The run's private Ramen image has no source revision label, so the deployed-build attribution is not proven.
    pause_after: 1.4

  - id: "7.4"
    chapter: Cleanup
    visual: The driver tries RemoveMembersFromVolumeGroup. The array returns HTTP 422 and the PV retries.
    narration: >-
      The driver tried to remove the volume from its group first. The array refused:
      HTTP four twenty-two, volumes cannot be removed from the replication destination
      volume group. The provisioner retried the delete. The PV stayed Released with its
      finalizer, and the same error repeated. The defect did not delete either array copy,
      and the target stayed healthy.
    evidence: DFBUGS-12906 actual results; controller.go deleteISCSIVolume
    pause_after: 1.4

  - id: "7.5"
    chapter: Cleanup
    visual: >-
      Defect card: DFBUGS-12906, Retain workaround, impact on decommission and the latent risk.
    narration: >-
      The lab's workaround was to patch the two PVs back to Retain. The defect record says
      that stopped the retry loop and kept both copies. The defect is filed as
      DFBUGS-12906. Its upstream code path is source-verified. The running build is a
      private Ramen image with no source revision label, so the deployed-build attribution
      stays unverified. The impact is a site that cannot be decommissioned cleanly, and a
      latent risk if the replication relationship is restructured before the pending delete
      is handled.
    evidence: DFBUGS-12906, open Major; reclaim evidence root-cause.md; lab path patch to Retain
    pause_after: 1.6

  - id: "8.1"
    chapter: Recap
    visual: The full chain in order, from the gate to the cleanup.
    narration: >-
      The whole chain. Prove the copy carried writes. Ask the hub for Failover with a
      target. Restore the objects and rewrite the group map. Promote the group once. Bind
      both claims to the promoted handles. Start the guest. Observe the storage health.
      Clean up the old application. Confirm the peer state and completion. Then the
      postcheck measures the gap, and the cleanup defect is what it leaves behind.
    evidence: VIRTDR-498 run log; DRPC conditions; VGRC; cleanup evidence
    pause_after: 1.6

  - id: "8.2"
    chapter: Recap
    visual: >-
      Two columns: what the run established, and what it does not establish.
    narration: >-
      What this run established: a recorded, reachable-source failover of a discovered
      RHEL application protected by Dell PowerStore volume-group replication; one group
      promotion for both disks; a measured one hundred seventy-five second loss window
      inside a nine hundred second policy; and a cleanup defect on the old site. What it
      does not establish: zero loss, a site-down failover, or a fix for DFBUGS-12906.
    evidence: VIRTDR-498 postcheck 17/17; DFBUGS-12906 open
    pause_after: 2.0
