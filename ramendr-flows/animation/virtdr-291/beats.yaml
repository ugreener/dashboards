    analogy: "Movers who box up the furniture and unpack it at the new address."
  narration: >
    For a discovered app there is no Git copy of the VM definition, so Ramen asks Velero, packaged by Red Hat as O A D P,
    to back up the app's Kubernetes objects to the same bucket: the VirtualMachine, its two DataVolumes and its cloud-init Secret.
    Velero is the moving company: it boxes things up and unpacks them at the new address.
