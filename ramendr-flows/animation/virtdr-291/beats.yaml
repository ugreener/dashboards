# ================= Chapter 13: what was verified =================
- id: "13.1"
  chapter: What was verified
  visual: "Guest panel: two reads, same sum, last row 2026-09-29, zero rows since 13:40."
  narration: >
    The data check. At 15:44:22 and again 30 seconds later, the recovered database showed the same order counter as before the failover,
    and no history rows newer than September 29th. Nothing was lost, and nothing new was written.
  evidence: [done]

- id: "13.2"
  chapter: What was verified
  narration: >
    Be careful what that proves. With the writer off, there were no recent writes that could be lost. So this run proves the recovery chain,
    the source pause and the manual cleanup. It does not measure data loss under load. That needs a separate run with the writer on.
  pause_after: 1.4
  evidence: [done]

- id: "13.3"
  chapter: What was verified
  screenshot: 32-bug-completed-hub-fleet-topology-no-clusters.png
  focus: {x: 700, y: 200, w: 800, h: 250}
  caption: "15:51:17 UTC · Topology tab: No clusters found (open bug VIRTDR-310)"
  narration: >
    The DRPolicy stayed validated with its fifteen-minute interval. One console issue remained: the Topology tab said no clusters found, before and after the run.
    That is the open bug VIRTDR-310, not a failover problem.
  evidence: [done, shot]

- id: "13.4"
  chapter: What was verified
  visual: "Recap panel, first half."
  narration: >
    Let's replay the chain. Protect: two V R Gs, copying disks, claim and VM definitions in S3. Check: recent syncs, quiet database.
    Initiate: the console sets action and failover cluster. Validate: target checked, spoke-0 kept as retained. Promote: claims rebuilt from S3, copies made writable.
  evidence: [ramen]

- id: "13.5"
  chapter: What was verified
  visual: "Recap panel, second half."
  narration: >
    Restore: Velero rebuilds the VM on spoke-1. Switch placement: the decision gains spoke-1, while the old VM freezes on a read-only disk.
    Manual cleanup: a person deletes the old VM and DataVolumes. Complete: the old V R G steps down, replication reverses, PeerReady True.
  evidence: [ramen, done]

- id: "13.6"
  chapter: What was verified
  visual: "Result card."
  narration: >
    The recorded result: VM running on spoke-1 about a minute after the click, source paused by an I O error, cleanup by hand,
    then Completed with the database intact. Each controller did one small job, and for a discovered app, the last job belongs to a person.
  pause_after: 2.5
  evidence: [pause, done]
