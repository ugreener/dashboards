- id: "1.9"
  chapter: Cast of characters
  card: {kind: "S3 bucket", name: ramen-metadata, role: "off-cluster notebook both sites can read"}
  def:
    what: "An S3 bucket on a MinIO object store, reachable from all three clusters through the profile minio-on-hub."
