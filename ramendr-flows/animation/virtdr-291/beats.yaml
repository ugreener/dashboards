    where: "Namespace openshift-dr-ops on both spokes, named hammerdb-drpc."
    analogy: "The branch manager who carries out head office orders."
  narration: >
    On each spoke, Ramen, the disaster recovery operator, keeps a VolumeReplicationGroup, V R G.
