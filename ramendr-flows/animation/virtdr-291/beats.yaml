# ================= Chapter 3: protected steady state =================
- id: "3.1"
  chapter: Protected steady state
  narration: >
    Why does protection need several pieces? Because a failover needs three things on the other site:
    a recent copy of the disks, a way to reconnect claims to those copies, and the VM definition itself.
    Miss any one, and there is nothing to start.
  evidence: [ramen]

- id: "3.2"
  chapter: Protected steady state
  visual: "Ramen hub sends ManifestWorks: VRG Primary to spoke-0, VRG Secondary to spoke-1; status back via ManagedClusterView."
  narration: >
    The Ramen hub operator sends a V R G envelope to each spoke. spoke-0 gets role Primary: protect the running app.
    spoke-1 gets role Secondary: be ready to receive it. A second envelope, hammerdb-drpc-hammerdb-ns-mw, makes sure namespace hammerdb exists on both.
    Status comes back through the cluster views.
  evidence: [live, ramen]

- id: "3.3"
  chapter: Protected steady state
  visual: "VRG on spoke-0 selects both PVCs in hammerdb and creates two VolumeReplications, role primary."
  narration: >
    On spoke-0, the Primary V R G looks in the protected namespace and, because the selector is empty, picks up both claims.
    For each one it creates a VolumeReplication with role primary and class powerstore-vrc-15m.
  evidence: [ramen, live]

- id: "3.4"
  chapter: Protected steady state
  visual: "csi-addons calls the driver; VSA-A to VSA-B copy flows."
  narration: >
    csi-addons sees the new VolumeReplications and asks the Dell driver, over g R P C, to enable replication.
    From then on VSA-A copies each disk to VSA-B on the fifteen-minute rule. In practice the array syncs about every twelve minutes.
  evidence: [csiaddons, roles]

- id: "3.5"
  chapter: Protected steady state
  visual: "VRG uploads PV + PVC definitions to ramen-metadata."
  narration: >
    The V R G also uploads the P V and P V C definitions to the S3 bucket, including the array volume handles.
    The other site will need them to reconnect claims to the copied volumes.
  evidence: [ramen]

- id: "3.6"
  chapter: Protected steady state
  visual: "Velero chip on spoke-0 sends kube objects to the bucket."
  define: {term: "kube object protection", text: "Ramen asks Velero to back up the namespace's Kubernetes objects to S3 on a schedule, so a discovered app can be rebuilt elsewhere."}
  narration: >
    This is the part that is special for discovered apps. Every fifteen minutes the V R G asks Velero to back up the objects in namespace hammerdb:
    the VirtualMachine, both DataVolumes and the cloud-init Secret. Before this run, both Velero archive copies were read back from MinIO and contained all four.
  evidence: [pause, ramen]

- id: "3.7"
  chapter: Protected steady state
  narration: >
    So far: two V R Gs, Primary on spoke-0 and Secondary on spoke-1. Disks copying from VSA-A to VSA-B.
    Claim definitions and VM definitions saved in S3. That is what protected means.
  evidence: [ramen]

# ================= Chapter 4: before the click =================
- id: "4.1"
  chapter: Before the click
  define: {term: "recovery point", text: "The moment the newest copy on the other array was taken. Writes after it are not on the replica."}
  narration: >
    Why check anything before clicking? Because a failover uses whatever copy the other array already has.
    The time of that copy is the recovery point. If a disk silently missed its syncs, the copy could be far older than fifteen minutes.
  evidence: [ramen]

- id: "4.2"
  chapter: Before the click
  visual: "Baseline panel: both sessions OK, last syncs, VSA-A Source / VSA-B Destination."
  narration: >
    At 13:53:45, the baseline inventory showed both replication sessions healthy, with no error.
    The root disk last synced at 13:51:26 and the data disk at 13:50:26. VSA-A was the source for both, VSA-B the destination.
  evidence: [pause, roles]

- id: "4.3"
  chapter: Before the click
  visual: "Guest panel: PostgreSQL active, HammerDB inactive/disabled, order sum 8,482,937, last history row 2026-09-29."
  narration: >
    One important limit. Inside the VM, Postgres was running, but the HammerDB writer had already been switched off before this test.
    The order counter stood at eight million, four hundred eighty-two thousand, nine hundred thirty-seven, and the newest history row was from September 29th.
    So this run tests recovery of a quiet database, not data loss under load.
  pause_after: 1.4
  evidence: [pause]

- id: "4.4"
  chapter: Before the click
  narration: >
    At the click, the oldest disk copy would be seven minutes old, well inside the fifteen-minute objective.
    So far: healthy sessions, recent copies, definitions backed up, and a database that is not writing.
  evidence: [pause]

# ================= Chapter 5: initiate =================
- id: "5.1"
  chapter: Initiate
  narration: >
    In the hub console, under Data Services, Disaster recovery, Protected applications, the operator opens the row for hammerdb-drpc and chooses Failover, with target cluster spoke-1.
    The dialog says failover readiness is Ready, and warns that for a discovered app, cleaning up the old site is a manual step.
  evidence: [pause]

- id: "5.2"
  chapter: Initiate
  t: "13:57:26"
  visual: "Console writes action and failoverCluster into the DRPC spec."
  narration: >
    At 13:57:26, Initiate. The console does not move anything itself. It writes two fields into the D R P C:
    action, Failover, and failover cluster, spoke-1. Everything after this is controllers reacting to that edit.
  pause_after: 1.2
  evidence: [done, live]

- id: "5.3"
  chapter: Initiate
  visual: "Ramen hub chip lights up reading the DRPC."
  narration: >
    The Ramen hub operator watches every D R P C. It notices the new action and starts working through the failover, one check at a time.
  evidence: [ramen]

# ================= Chapter 6: hub checks the target =================
- id: "6.1"
  chapter: Hub checks the target
  visual: "Ramen reads spoke-1 VRG through the ManagedClusterView; DRPC phase FailingOver; PeerReady False."
  narration: >
    First, is the target ready to take over? Through the cluster view, Ramen reads spoke-1's V R G. It must be a settled Secondary.
    It is, so the D R P C phase becomes FailingOver, and PeerReady turns False: until this is over, there is no healthy spare site.
  evidence: [ramen]

- id: "6.2"
  chapter: Hub checks the target
  visual: "PlacementDecision keeps spoke-0 with a retained marker."
  narration: >
    Ramen does not drop spoke-0 from the decision yet. It keeps it, marked as retained for the failover,
    so nothing on spoke-0 is torn down before the new site works.
  evidence: [ramen]

- id: "6.3"
  chapter: Hub checks the target
  t: "13:57:38"
  visual: "ManifestWork envelope to spoke-1: VRG primary, action Failover. Progression WaitingForResourceRestore."
  narration: >
    Then it updates the envelope for spoke-1: V R G role Primary, action Failover. The work agent applies it.
    The progression shows WaitingForResourceRestore, observed at 13:57:38. The hub now waits for spoke-1 to rebuild the app.
  evidence: [pause, ramen]

- id: "6.4"
  chapter: Hub checks the target
  narration: >
    So far: target checked, the old site kept in the decision as a safety net, and spoke-1 told to become Primary.
  evidence: [ramen]

# ================= Chapter 7: promotion on spoke-1 =================
- id: "7.1"
  chapter: Promotion on spoke-1
  narration: >
    Why is promotion needed? Because on spoke-1 the copied volumes exist only on the array. No claim points at them, and the array keeps them read-only.
    Both problems must be fixed before a VM can use them.
  evidence: [ramen, powerstore]

- id: "7.2"
  chapter: Promotion on spoke-1
  visual: "VRG on spoke-1 downloads PV + PVC from S3, recreates claims pointing at VSA-B handles."
  narration: >
    The V R G on spoke-1 becomes Primary. Before anything else, it downloads the P V and P V C definitions from S3,
    swaps in the address of the copy on VSA-B, and recreates both claims. Now the claims point at the replicas.
  evidence: [ramen, roles]

- id: "7.3"
  chapter: Promotion on spoke-1
  visual: "VRG creates VolumeReplications role primary; csi-addons calls Promote."
  narration: >
    Then it creates a VolumeReplication for each claim with role primary. csi-addons calls Promote on the Dell driver.
    Because this is a failover, not a planned move, the driver runs an unplanned failover on each replication session.
  evidence: [ramen, csiaddons, powerstore]

- id: "7.4"
  chapter: Promotion on spoke-1
  visual: "Array roles flip: VSA-B writable source, VSA-A read-only destination. Handles panel."
  narration: >
    The roles on the arrays flip. The copies on VSA-B become the writable sources. The originals on VSA-A become destinations, which means read-only.
    The run recorded both target claims bound to VSA-B handles, and the VSA-A sessions now listed as Destination.
  pause_after: 1.4
  evidence: [pause, roles]

- id: "7.5"
  chapter: Promotion on spoke-1
  narration: >
    So far: claims rebuilt from S3 on spoke-1, pointing at the copies on VSA-B, and those copies made writable.
    The disks are ready. But there is still no VM.
  evidence: [ramen]

# ================= Chapter 8: restoring the VM =================
- id: "8.1"
  chapter: Restoring the VM
  narration: >
    In a Git-managed app, a GitOps tool would now redeploy the VM from the repository. A discovered app has no repository.
    The only copy of the VM definition is the Velero archive in S3.
  evidence: [ramen]

- id: "8.2"
  chapter: Restoring the VM
  visual: "Velero chip on spoke-1 restores VM, DataVolumes, Secret from the bucket into hammerdb."
  narration: >
    So once the volumes are ready, the V R G asks Velero on spoke-1 to restore the protected namespace from the latest archive:
    the VirtualMachine, both DataVolumes and the Secret. Volumes first, then objects, so the VM finds its disks already waiting.
    When this finishes, the V R G reports kube objects ready.
  evidence: [ramen, shot]

- id: "8.3"
  chapter: Restoring the VM
  visual: "DataVolumes on spoke-1 find existing claims and report Succeeded."
  narration: >
    The restored DataVolumes find claims with their names already in place, the ones rebuilt from S3, and report Succeeded, instead of creating blank disks.
    The run recorded that outcome. The exact importer steps behind it were not traced, so treat that detail as inference.
  unverified: "CDI adoption mechanics for restored DataVolumes"
  evidence: [done]

- id: "8.4"
  chapter: Restoring the VM
  t: "13:58:28"
  screenshot: 14-promotion-hub-fleet-source-paused-target-running.png
  focus: {x: 350, y: 440, w: 1200, h: 300}
