  narration: >
    How the arrays should copy is described in a VolumeReplicationClass called powerstore-vrc-15m.
    It names the Dell driver, the partner array, and a fifteen-minute schedule. It is cluster-wide settings, created once per spoke.
  evidence: [pause]

- id: "1.7"
  chapter: Cast of characters
  card: {kind: VolumeReplication, name: hammerdb-rhel9-rootdisk, role: "switch: this disk is primary or secondary"}
  def:
    what: "A Kubernetes request to replicate one claim, with a desired role: primary (writable source) or secondary (read-only copy)."
    creator: "Ramen, one per protected claim, named after the claim."
    reader: "The csi-addons controller, which calls the Dell driver over gRPC."
    where: "Namespace hammerdb, next to its claim."
    analogy: "A light switch for one disk: writable here, or copy here."
  narration: >
    Kubernetes controls the arrays through VolumeReplication objects, one per disk, named after its claim.
    Each one says: this disk should be primary, the writable source, or secondary, the read-only copy.
    A controller called csi-addons watches them and tells the Dell driver what to do.
  evidence: [ramen, csiaddons]

- id: "1.8"
  chapter: Cast of characters
  card: {kind: VolumeReplicationGroup, name: hammerdb-drpc, role: "Ramen's site manager on one spoke"}
  def:
    what: "Ramen's per-cluster object for one protected app. It selects the claims, creates the VolumeReplications, and backs up definitions to S3."
