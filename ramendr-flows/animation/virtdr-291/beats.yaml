# ================= Chapter 12: completed =================
- id: "12.1"
  chapter: Completed
  visual: "Lock opens on spoke-0 VRG; VolumeReplications set secondary; csi-addons Demote, Resync."
  narration: >
    With the pod gone, the lock on spoke-0 opens. The V R G there sets its VolumeReplications to secondary,
    and csi-addons calls Demote and Resync. For a failed-over session the Dell driver runs Reprotect, which reverses the copy direction: now VSA-B copies to VSA-A.
  evidence: [ramen, csiaddons, powerstore]

- id: "12.2"
