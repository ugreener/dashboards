  narration: >
    At 13:58:28, about one minute after the click, the VM on spoke-1 was running and ready, on worker-2.
    This search a little later shows two VMs with the same name: the new one running on spoke-1, and the old one on spoke-0, marked Paused.
  pause_after: 1.4
  evidence: [pause, shot]

- id: "8.5"
  chapter: Restoring the VM
  visual: "Guest panel on spoke-1."
  narration: >
    Inside the recovered guest at 14:01:16, Postgres was active, and the writer was still off, exactly as before.
    The order counter matched: eight million, four hundred eighty-two thousand, nine hundred thirty-seven.
    So far: the VM is rebuilt on spoke-1 from S3 definitions and promoted disks.
  evidence: [pause]

# ================= Chapter 9: the source freezes =================
- id: "9.1"
  chapter: The source freezes
  narration: >
    Now back to spoke-0. Nobody stopped the old VM. A failover assumes the old site may already be gone, so it does not shut it down first.
    What happened to it?
  evidence: [pause]

- id: "9.2"
  chapter: The source freezes
  t: "13:57:36"
  visual: "Red arrow: write from spoke-0 VM to VSA-A rejected: read-only."
  narration: >
    At 13:57:36, ten seconds after the click, the old VM tried to write to its root disk. The volume on VSA-A was now a replication destination,
    so the array refused: attempted write to read-only range. The investigation matched the disk's identity to this VM's original root volume.
  pause_after: 1.2
  evidence: [pause]

- id: "9.3"
  chapter: The source freezes
  narration: >
    The VM's disk settings say error policy stop, which is the KubeVirt default. So on a disk error, the hypervisor pauses the guest instead of passing the error inside.
    Paused is not powered off: the process and memory stay, but the guest stops executing.
  evidence: [pause, kubevirt]

- id: "9.4"
  chapter: The source freezes
  screenshot: 15-promotion-spoke-0-fleet-vm-paused-ioerror-conditions.png
  focus: {x: 358, y: 830, w: 1200, h: 225}
  caption: "14:00:53 UTC · spoke-0 VM conditions: Ready False, readiness gate virtual-machine-unpaused is False"
  narration: >
    KubeVirt then marks the VM instance Paused, with reason PausedIOError: low-level I O error detected.
    This view of the spoke-0 VM shows the side effect: Ready is False, because the unpaused readiness gate is False.
  evidence: [pause, shot, kubevirt]

- id: "9.5"
  chapter: The source freezes
  narration: >
    The logs also show automatic resume attempts, each followed by another pause on the next failed write.
    So this is a side effect of the storage roles flipping, not a deliberate shutdown by Ramen, and not a guaranteed fence.
    Its process stays alive, and its disks stay attached.
  evidence: [pause]

- id: "9.6"
  chapter: The source freezes
  narration: >
    So far: the target is running, and the source is frozen but still present. That leftover copy is the next problem.
  evidence: [pause]

# ================= Chapter 10: placement and the wait =================
- id: "10.1"
  chapter: Placement and the wait
  visual: "Ramen reads spoke-1 VRG ready; adds spoke-1 to PlacementDecision; phase FailedOver."
  narration: >
    Back on the hub, Ramen sees through the view that spoke-1's V R G is Primary and ready.
    Only then does it add spoke-1 to the PlacementDecision. The D R P C phase becomes FailedOver.
  evidence: [ramen, pause]

- id: "10.2"
  chapter: Placement and the wait
  define: {term: "WaitOnUserToCleanUp", text: "Ramen will not delete a discovered app's objects. It waits until a person removes them from the old cluster."}
  narration: >
    Next, Ramen wants the old site to become the new Secondary, so replication can run in reverse. For that, the old VM must be gone.
    In a Git-managed app the GitOps tool would remove it. For a discovered app Ramen will not delete your objects.
    So the progression becomes WaitOnUserToCleanUp.
  pause_after: 1.2
  evidence: [ramen, pause]

- id: "10.3"
  chapter: Placement and the wait
  screenshot: 21-cleanup-gate-hub-fleet-hammerdb-status-1920.png
  focus: {x: 400, y: 100, w: 1100, h: 520}
  caption: "14:08:59 UTC · Protected applications: WaitOnUserToCleanUp, Action needed, 3 of 4 steps completed"
  narration: >
    The console shows it plainly. Action needed, three of four steps completed: preparing, failover and restoring are done, clean up is pending.
    It asks the user to delete the application on the failed cluster, spoke-0.
  evidence: [shot]

- id: "10.4"
  chapter: Placement and the wait
  visual: "Lock on spoke-0 VRG: claims still in use by the paused VM's pod."
  narration: >
    Why can't it just carry on? Before the old V R G can step down, Ramen checks that no pod still uses its claims.
    The paused VM's pod still holds both disks, so the lock stays closed.
  evidence: [ramen]

- id: "10.5"
  chapter: Placement and the wait
  narration: >
    In this run, the failover was deliberately left at this gate for about an hour and a half, while the pause was investigated.
    Deleting the old VM needed its own explicit approval, separate from the approval to fail over.
    So far: placement moved, and the hub waits for a human.
  evidence: [pause, done]

# ================= Chapter 11: manual cleanup =================
