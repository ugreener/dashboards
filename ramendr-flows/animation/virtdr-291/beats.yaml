# ================= Chapter 0: cold open =================
- id: "0.1"
  chapter: Cold open
  t: "13:57:26"
  visual: "Typed timestamp, click ripple, VM teaser moves spoke-0 to spoke-1, elapsed counter to +1m 02s, then a frozen source VM and a slow second counter."
  narration: >
    At 13:57:26 UTC on October 5th, someone clicked Failover in a web console.
    About one minute later, a database virtual machine was running on another OpenShift cluster, on disks that two Dell storage arrays had been copying.
    But the old copy of the virtual machine froze in place, and the failover could only finish after a person cleaned it up by hand.
    This video walks through every handoff, and explains why.
  pause_after: 1.8
  evidence: [pause, done]

