    analogy: "A ticket stub that says which locker on the array is yours."
  narration: >
    The disk itself is a PersistentVolumeClaim, P V C, a request for storage.
    The claim is bound to a PersistentVolume, P V, which holds the volume handle, the address of the real volume on the Dell array.
    The data disk is 20 gigabytes and the root disk 35, both from the storage class powerstore-sc.
  evidence: [roles]

- id: "1.5"
  chapter: Cast of characters
  card: {kind: "PowerStore replication session", name: "52001a43-4c9e-44c2-ad24-df241b86b69d", role: "the array copies one volume to its peer"}
  def:
    what: "An array-level link that copies one volume to a partner array on a schedule. One side is Source, the other is Destination."
    creator: "The Dell CSI driver, when replication is enabled for a volume."
    reader: "The arrays themselves. Kubernetes never touches the copy traffic."
    where: "Between VSA-A (spoke-0) and VSA-B (spoke-1). One session per disk."
    analogy: "A courier that ships a fresh photocopy of a folder every few minutes."
  narration: >
    The copying is done by the arrays, not by Kubernetes. Each disk has a PowerStore replication session.
    This one copies the root disk from array VSA-A to array VSA-B. The data disk has its own session.
    The source side is writable. The destination side is a read-only copy that is refreshed on a schedule.
  evidence: [roles]

