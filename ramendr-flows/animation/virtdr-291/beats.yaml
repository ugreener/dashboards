- id: "1.10"
  chapter: Cast of characters
  card: {kind: "Velero (OADP)", name: openshift-adp, role: "packs the VM's objects into S3, and unpacks them"}
  def:
    what: "Velero is a backup tool for Kubernetes objects. OADP is Red Hat's packaging of it, in namespace openshift-adp."
