- id: "1.3"
  chapter: Cast of characters
  card: {kind: DataVolume, name: hammerdb-rhel9-rootdisk, role: "recipe that fills a VM disk"}
  def:
    what: "A request to the Containerized Data Importer, CDI, to create a disk and fill it, for example from an OS image."
    creator: "Created together with the VM."
    reader: "CDI creates and owns the disk claim it describes."
    where: "Namespace hammerdb. Two of them: hammerdb-rhel9-rootdisk and hammerdb-rhel9-datadisk."
