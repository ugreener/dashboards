  narration: >
    The VM has two disks. Each one starts life as a DataVolume, a recipe that tells the data importer, C D I, to create a disk and fill it.
    Here they are hammerdb-rhel9-rootdisk for the operating system and hammerdb-rhel9-datadisk for the database.
    A DataVolume owns the disk claim it creates. Deleting the DataVolume deletes its claim too.
  evidence: [done]

- id: "1.4"
  chapter: Cast of characters
  card: {kind: PersistentVolumeClaim, name: hammerdb-rhel9-datadisk, role: "the VM's claim on a real disk"}
  def:
    what: "A PersistentVolumeClaim, PVC, is a request for storage. It is bound to a PersistentVolume, PV, that points at a real volume on the array."
    creator: "CDI, for each DataVolume. The Dell CSI driver creates the PV and the array volume."
    reader: "The VM's pod mounts the claim as a block device."
