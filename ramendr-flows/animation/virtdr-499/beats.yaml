  - id: "2.6"
    chapter: Protection
    visual: Panel. Two managed-only checks. A Git path with a DataVolume per disk.
    narration: >-
      Two of those checks exist only for a managed application. Each protected disk must
      have a Succeeded DataVolume that Argo tracks, and the target must not need a clone
      source in the workload namespace. The reason is ownership: Argo can only remove what
      Git defines. A claim created outside Git would survive the move and hold the old
      site's cleanup open. This run meets the rule but does not exercise the failure.
    evidence: preflight checks 6 and 7; workloads/datavolumes.yaml; documented lab constraint, not an observed failure
    unverified: true
    pause_after: 1.2

