  - id: "4.1"
    chapter: Promotion
    visual: Target site. PV and claim records restored, then the group map read.
    narration: >-
      On the target, Ramen restores the storage records: a PersistentVolume and a claim for
      each disk, from the archive it keeps. The restored claim has no owner and no stale
      replication annotation, which matters later. The group manifest is the map: it records
      the group handle and each disk's destination copy, so the target can name the copies
      that already exist on its array.
    evidence: VIRTDR-499 description (group mapping); source trace cleanupPVCForRestore and updateVGRCVolumeHandlesForRestore; postcheck target handles
    pause_after: 1.2

  - id: "4.2"
    chapter: Promotion
    visual: Panel. The group record, its companion VolumeReplication, csi-addons and the driver.
    narration: >-
      The group record has a companion, a VolumeReplication that carries its state. On the
      target it asks for primary, and csi-addons, the Kubernetes side of the storage driver,
      turns that request into a driver call: promote the group. The run records the result,
      not the call. The call path is what the controller source says produces it.
    evidence: VIRTDR-499 description (companion VolumeReplication); source trace PromoteVolume path; the run records one group session and two promoted handles
    unverified: true
    pause_after: 1.2

  - id: "4.3"
    chapter: Promotion
    visual: The Dell driver chip and the array pair, one arrow flipping.
    narration: >-
      The driver's group promote is one array failover, not one per disk. Both disks change
      role together, so the guest can never see one disk promoted before the other. The
      run's evidence for that is the single group session that covers both claims, and both
      claims landing on promoted disks.
    evidence: preflight one session id for both claims; postcheck both target handles on PS3b37452a6e0f; source trace promoteVolumeForVolumeGroup
    pause_after: 1.4

  - id: "4.4"
    chapter: Promotion
    visual: Panel with the two target handles and the arrays.
    narration: >-
      Both target claims bound to promoted disks on VSA-A. The panel shows the exact volume
      handles from the postcheck, and the old copies stayed on VSA-B. The claims now point at
      the same two disks the group promoted, which is what the group was for.
    evidence: postcheck target handles 7ef2772a-9bd1-4985-bfa4-42585ea463ad and 201b3d01-7e13-42c2-a6e3-fb0a00c4252c on PS3b37452a6e0f
    pause_after: 1.4

  - id: "4.5"
    chapter: Promotion
    visual: Panel with the two site records and the replication health entry.
    narration: >-
      The target coordinator reports primary, and the old site's coordinator reports
      secondary once its role change finishes. Neither record alone says the copy is flowing.
      For that, read the arrays in the next chapters, and the replication health entry on the
      hub record.
    evidence: postcheck VRG spoke-0 Primary, VRG spoke-1 Secondary, replication health 10:56:59, Protected 11:12:00
    pause_after: 1.4

  - id: "5.1"
    chapter: The application plane
    visual: Two lanes, storage and application. The application lane is empty.
    narration: >-
      Now the second plane. The storage records say which disk is writable. They do not
      create a virtual machine. The VM, its DataVolumes and the Application are Kubernetes
      objects, and someone has to remove them from the old site and create them on the new
      one. For a managed application, that someone is GitOps.
    evidence: VIRTDR-499 description, Scope (ApplicationSet prune and redeploy)
    pause_after: 1.2

  - id: "5.2"
    chapter: The application plane
    visual: PlacementDecision card with spoke-1 changing to spoke-0.
    narration: >-
      The placement decision is the switch, and it only moves after the target reports its
      data ready. Ramen rewrites the decision to spoke-0, and the decision record now names
      spoke-0. The ApplicationSet generator reads that record on its timer, so the next pass
      generates an Application for the new cluster.
    evidence: postcheck PlacementDecision on target ['spoke-0']; source trace checkReadiness gate; ApplicationSet requeueAfterSeconds 180
    pause_after: 1.2

  - id: "5.3"
    chapter: The application plane
    visual: ApplicationSet generating the spoke-0 Application, the spoke-1 Application fading out.
    narration: >-
      The generator creates dell-vm-workload-spoke-0 and removes the entry for spoke-1. The
      old Application disappears, and with automated sync, prune and self-heal, Argo CD
      deletes what that Application owned on the old site: the virtual machine and its two
      DataVolumes. Nothing is deleted by hand.
    evidence: ApplicationSet syncPolicy automated prune selfHeal; source trace deleteInCluster and resources finalizer; postcheck source objects removed
    pause_after: 1.4

  - id: "5.4"
    chapter: The application plane
    visual: Source site cards fading out, source VRG turning Secondary.
    narration: >-
      By the end of the run, the source is empty. On spoke-1 there is no virtual machine, no
      instance, no DataVolume and no claim left, and the source coordinator has become
      secondary. Ramen's own status says why it did not clean up: automated cleanup not
      applicable, GitOps manages the application's resource lifecycle.
    evidence: postcheck source VM/VMI/DV/PVC removed none, VRG spoke-1 Secondary; VRG AutoCleanup condition message from source trace
    pause_after: 1.2

