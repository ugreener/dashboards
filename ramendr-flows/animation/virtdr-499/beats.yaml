# yamllint disable rule:line-length
ticket: VIRTDR-499
run: 2026-11-22
direction: spoke-1 to spoke-0 failover, VSA-B to VSA-A, both sites reachable
beats:
  - id: "0.1"
    chapter: Cold open
    visual: Wide dark frame. Two site bands, one writing database, a Git branch above. The title "Two planes, one handover" fades in.
    narration: >-
      Two sites, one database, writing. The operator asks the other site to take over
      while both sites are still healthy. This time the application is managed: its
      virtual machine is defined in Git, and its two disks are one replication group.
      The handover has to move the disks and the definition.
    evidence: VIRTDR-499 description, scope and environment
    pause_after: 1.6

  - id: "0.2"
    chapter: Cold open
    visual: Outcome card. "365 s outside the copy" and "900 s policy" appear, then "47 minutes walked, none missing" and "17 of 17 checks".
    narration: >-
      It worked. The database came back on the recovery site with three hundred
      sixty-five seconds of writes missing, inside a policy that allows nine hundred
      seconds of loss. The copy was complete for the forty-seven minutes the check
      walked, with no missing minute. All seventeen checks passed. This video follows the
      run, and the two planes it had to move.
    evidence: postcheck-20261122T112406Z.json, 17 of 17; lost writes 365 s; 47 complete source minutes, missing none
    pause_after: 1.6

  - id: "1.1"
    chapter: The pieces
    visual: Two site cards, a hub card, and two array strips. The workload sits on the run's source site.
    narration: >-
      Start with the floor plan. Two OpenShift clusters, called spokes. spoke-1 on
      ocp-edge97 is the source of this run. spoke-0 on ocp-edge95 is the recovery site,
      and the cluster the DR record prefers. A third cluster, the hub on ocp-edge36,
      holds the control records. Each spoke has a PowerStore array: VSA-B at the source,
      VSA-A at the recovery site.
    evidence: VIRTDR-499 description, Environment; DRPC preferredCluster spoke-0 in hub-dr/drpc.yaml
    pause_after: 1.4

  - id: "1.2"
    chapter: The pieces
    visual: Hub band with three cards in one namespace, workload band with the VM and disks in another.
    narration: >-
      This application is managed, which means Git defines it. Argo CD, the controller
      that delivers manifests from Git, runs on each spoke. The ApplicationSet, the
      Placement and the disaster recovery record, the DRPlacementControl, all live in one
      namespace on the hub, openshift-gitops. The virtual machine and its two disks live in
      gitops-vms. In this setup the split follows two constraints: the Argo generator reads
      decisions in its own namespace, and Ramen, the disaster recovery controller, needs
      the placement and its DR record together.
    evidence: hub-dr/applicationset.yaml and drpc.yaml comments; VIRTDR-499 description, scope
    pause_after: 1.4

  - id: "1.3"
    chapter: The pieces
    visual: ApplicationSet card, generator arrow to PlacementDecision, then an Application envelope to each spoke.
    narration: >-
      The ApplicationSet is a template with a generator. On a timer, every three minutes,
      the generator reads the placement decision: the record that names the cluster the
      application should run on. For each cluster in that decision it creates an
      Application named dell-vm-workload-spoke-0 or dell-vm-workload-spoke-1. The hub does
      not run the workload. It hands the Application to that spoke through the management
      plane, and the spoke's Argo CD pulls the manifests from Git.
    evidence: hub-dr/applicationset.yaml (clusterDecisionResource, requeueAfterSeconds 180, pull-model labels); screenshots 05 and 13
    pause_after: 1.4

  - id: "1.4"
    chapter: The pieces
    visual: The VM card, two claim cards, and a PersistentVolume record with a volume handle.
    narration: >-
      The workload is one RHEL 9 virtual machine, hammerdb-rhel9. PostgreSQL holds a
      TPC-C database, and a HammerDB writer keeps it busy. The guest sees two disks, and
      Kubernetes sees two requests for storage, called claims: hammerdb-rhel9-rootdisk-mgd-grp
      and hammerdb-rhel9-datadisk-mgd-grp. A claim is a request. It becomes usable when
      Kubernetes binds it to a PersistentVolume, the record that names the real disk.
    evidence: run log Configuration; workloads/virtualmachine.yaml claims; postcheck target handles
    pause_after: 1.2

  - id: "1.5"
    chapter: The pieces
    visual: Definition scene. A DataVolume card and a plain-language panel.
    narration: >-
      Each disk also has a DataVolume with the same name. A DataVolume is the object that
      prepares a disk: it clones a golden image, or creates an empty disk, and then hands
      the claim a ready volume. Here the root disk clones the rhel9 image, and the data
      disk starts blank. Both DataVolumes are defined in Git, so Argo CD owns them and can
      remove them later.
    evidence: workloads/datavolumes.yaml at 8a94cd637d22; preflight check 6
    card:
      kind: DataVolume
      name: hammerdb-rhel9-rootdisk-mgd-grp
      role: prepares the root disk from the rhel9 image
    def:
      what: A request that builds or reuses a disk before a claim binds to it
      creator: CDI, the Kubernetes add-on that manages virtual machine disks
      reader: Argo CD, Kubernetes, and anyone checking why a disk exists
      where: in the workload namespace, next to the claim it serves
      analogy: an order that has the storage ready before the clerk hands you the key
    pause_after: 1.4

  - id: "1.6"
    chapter: The pieces
    visual: Two arrays, one session between them, and a group class card naming source, peer and schedule.
    narration: >-
      The two claims are protected as one group. The policy dr-policy-15m advertises
      powerstore-sc-group as a grouped peer class, and the group class powerstore-vgrc-15m
      names the source array, the peer array and the fifteen-minute schedule. On each array
      the two disks are one replication session, so they share one recovery point. One disk
      cannot be promoted without the other.
    evidence: VIRTDR-499 description, Scope (grouping true, powerstore-vgrc-15m, powerstore-vrc-group-15m); preflight sessions (one session id for both claims)
    pause_after: 1.4

  - id: "1.7"
    chapter: The pieces
    visual: DRPC card on the hub, one VRG card on each spoke, selector chip.
    narration: >-
      Ramen's record for the application is the DRPlacementControl dell-vm-placement-drpc,
      and it selects the claims by label: appname in hammerdb-rhel9-mgd-grp. Each site has
      a VolumeReplicationGroup with the same name, in gitops-vms, the site's coordinator,
      reporting whether that site is primary or secondary. The DR record does not set
      protectedNamespaces, because that field belongs to the discovered path, where Ramen
      also copies Kubernetes objects. Here Git is the copy.
    evidence: hub-dr/drpc.yaml (pvcSelector, no protectedNamespaces); postcheck VRG results
    pause_after: 1.4

  - id: "1.8"
    chapter: The pieces
    visual: Two columns, Failover and Relocate, then the policy card with 900 s highlighted.
    narration: >-
      Two actions, two promises. Failover is crash-consistent: it stops at the last
      completed copy, and writes after it are lost. Relocate is the planned action,
      designed to move the workload without that loss. The policy sets a recovery point
      objective of nine hundred seconds, which is the most data the business accepts
      losing. It is a limit, not a promise that the copy is fresh.
    evidence: VIRTDR-499 description, Scope (Failover, crash-consistent, not Relocate); DRPolicy 900 s
    pause_after: 1.4

  - id: "1.9"
    chapter: The pieces
    visual: Recap panel. The two planes drawn as two lanes.
    narration: >-
      So far: two sites, one managed application, two claims in one group, and one array
      session. Two planes have to move. The storage plane moves the disks and decides which
      copy is writable. The application plane removes the virtual machine and its disks
      from the old site and creates them on the new one, reusing the promoted disks. The
      next chapters follow both.
    evidence: Recap of the recorded chain; no new claim
    pause_after: 1.2

