  - id: "7.4"
    chapter: Reverse copy
    visual: Leftover PV panel with the two names.
    narration: >-
      One thing stays behind. The old source volumes csivol-5a803ae045 and
      csivol-1bdcd8b387 remain on spoke-1, released but kept with a retain policy. They
      still point at copies the reverse replication uses. The run left them in place.
      Removing them is a separate cleanup before any move back.
    evidence: evidence-index.md, old source PVs Released/Retain; VIRTDR-499 description (do not delete source copies)
    pause_after: 1.4

  - id: "7.5"
    chapter: Reverse copy
    visual: Panel with three closed doors, zero loss, site down, back home.
    narration: >-
      What this run does not prove: zero loss, a failover with the source site down, or a
      move back. A move back is a Relocate, and this run did not do one. Protection is
      restored. The workload is running on the cluster the DR record prefers.
    evidence: VIRTDR-499 description, scope and site-down variant VIRTDR-368; postcheck no relocate
    pause_after: 1.4

  - id: "8.1"
    chapter: Recap
    visual: Full chain, both planes, in order.
    narration: >-
      The chain in order. Prove the copy carries writes. Ask for Failover with a target.
      Restore the storage records and the group map. Promote the group once. Move the
      placement decision. Deploy the application on the target and let CDI adopt the promoted
      disks. Start the guest. Let the source cleanup finish. Then measure the gap.
    evidence: Recap of the recorded chain and source trace
    pause_after: 1.4

  - id: "8.2"
    chapter: Recap
    visual: Established panel with the measured numbers.
    narration: >-
      What this run established: a recorded, reachable-source failover of a managed RHEL
      application whose two disks are one group. One promotion for both disks. Cleanup and
      redeploy by GitOps, with no manual deletion. A loss window of three hundred sixty-five
      seconds inside a nine-hundred-second policy, and seventeen of seventeen checks passed.
      No new product defect was found.
    evidence: postcheck 17 of 17; VIRTDR-499 run log PASS
    pause_after: 2.0
