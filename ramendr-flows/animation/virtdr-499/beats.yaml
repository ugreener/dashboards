  - id: "5.6"
    chapter: The application plane
    visual: DataVolume card and claim card joining, CDI chip adopting, golden image crossed out.
    narration: >-
      Here is the join between the two planes. Argo creates a DataVolume for each disk, but
      a claim with that name already exists, bound to the promoted disk and left without an
      owner by the restore. CDI, with the DataVolumeClaimAdoption gate enabled on both
      spokes, adopts that claim instead of cloning the golden image. The check that matters
      is the handle: both target claims point at the promoted disks, not at fresh clones.
    evidence: preflight checks 6 and 7; setup doc feature gates; CDI adoption doc; postcheck target handles use promoted replicas
    pause_after: 1.6

  - id: "5.7"
    chapter: The application plane
    visual: The guest starting, PostgreSQL and the writer coming alive.
    narration: >-
      Then the guest. The target instance is running, PostgreSQL comes up, and the HammerDB
      writer starts on its own. The postcheck found both guest services active, and the first
      target row was written at eleven oh oh ten. The application was serving again.
    evidence: postcheck target VMI Running, guest services ['active','active'], first target row 11:00:10
    pause_after: 1.4

  - id: "6.1"
    chapter: Data
    visual: A number line from the last sync to Initiate, the lost window shaded.
    narration: >-
      Back to the copy. The last completed sync was ten forty-nine fifty. Initiate was ten
      fifty-five fifty-five. The writes in those three hundred sixty-five seconds were not in
      the copy, and failover does not ask for a final sync. The policy allows nine hundred
      seconds, so the loss was inside it.
    evidence: postcheck data loss within RPO 365 s (RPO 900 s); failover issues no final sync
    pause_after: 1.4

  - id: "6.2"
    chapter: Data
    visual: A second number line, from the last completed sync to the first target row.
    narration: >-
      Those are two different measurements. The lost window is what never reached the copy.
      The recovery gap runs from the last completed sync to the first target row: ten
      forty-nine fifty to eleven oh oh ten, six hundred twenty seconds. It measures how old
      the recovered copy was when the guest started writing.
    evidence: postcheck gap_start 10:49:50, gap_end 11:00:10, 620 s
    pause_after: 1.4

  - id: "6.3"
    chapter: Data
    visual: Panel with the walked minutes and the writer counts.
    narration: >-
      The check then walked the copy itself. It found forty-seven complete source minutes
      before the last sync, and no missing minute. The last interval before Initiate carried
      forty-one thousand two hundred forty-three rows. The postcheck then stopped the writer
      and left the database running, and the count ended at nine million eight hundred
      fifty-eight thousand thirty-six.
    evidence: postcheck 47 complete source minutes, missing none; 41,243 rows; writer count 9,858,036 to 9,858,036
    pause_after: 1.4

  - id: "6.4"
    chapter: Data
    visual: Verdict panel with three lines showing no missing minute, 365 s lost, inside 900 s.
    narration: >-
      So the verdict is narrow and honest. The copy had no missing minute in the forty-seven
      it walked, and three hundred sixty-five seconds of later writes are lost. That is
      inside the nine-hundred-second objective. It is not zero loss, and it is not a claim
      about every transaction.
    evidence: postcheck verdict; VIRTDR-499 description, data integrity requirement
    pause_after: 1.6

