    narration: 'The source VRG on spoke-1 had become Secondary. This historical resource view supports that later phase. Be careful with its condition timestamps: the resumed source clocks were behind, so those timestamps are not a reliable wall-clock sequence by themselves. We use the run observations for ordering and keep the clock problem separate from the resource role.'
