  - id: '8.6'
    chapter: Complete and reverse protection
    visual: Nodes Ready, work delivered, hub availability Unknown are separate signals.
    narration: 'One separate problem remained in the Phase B attachment. The nodes were Ready, but the hub still showed source availability Unknown. A sampled node clock was about six thousand, three hundred and ninety-four seconds slow after suspension. The management agent refused status updates because of that clock difference, even though work delivery still functioned and the DRPC completed.'
    evidence: [phase-b-observations, source-trace]
  - id: '8.7'
    chapter: Complete and reverse protection
    visual: Honest unresolved aftermath and completion recap.
    narration: 'So far, cleanup completed, source demotion was recorded, and fresh reverse replication was observed. The attachment recommended stepping the resumed node clocks, but did not record that repair or restored hub availability. We do not animate it as done. Node readiness, instruction delivery, DR completion and management availability are different signals, not interchangeable health badges.'
    evidence: [phase-b-observations]
  - id: '9.1'
    chapter: What the test established
    visual: Replay full chain with one plain handoff per row.
    narration: 'The final recap matters because success has several boundaries. First prove the syncs carried writes. Then freeze the source and initiate in the hub console. Promote replicas and restore the guest. Measure the recovered data while the source stays down. Only afterward resume and clean the old application, demote the peer and verify reversed replication.'
    evidence: [run-log, phase-b-observations, source-trace]
  - id: '9.2'
    chapter: What the test established
    visual: Measured result and raw FAIL side by side.
    narration: 'This test established discovered RHEL recovery with the source suspended, recorded data checks within the fifteen-minute objective, and later completion after separately authorized cleanup. The original eleven-of-fourteen automated FAIL remains part of the record, together with the documented checker defects and follow-up evidence. The long source-down hold is not a measurement of guest recovery time.'
    evidence: [run-log, jira-follow-up, phase-b-observations]
  - id: '9.3'
    chapter: What the test established
    visual: Limits and final reference to VIRTDR-342.
    narration: 'So far, we have followed the whole recorded chain without claiming more than the evidence supports. This is not zero-loss proof, a Relocate test, Windows coverage or managed-application coverage. It is not a live health inventory. The pinned upstream source explains the mechanisms, but does not identify the deployed builds. The full evidence remains on VIRTDR-342.'
    evidence: [source-trace, ticket]
