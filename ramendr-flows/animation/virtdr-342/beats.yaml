    visual: Peer array corroboration, not promotion snapshot reused.
    narration: 'The peer array view corroborates the reversal. VSA-B is now Destination, receiving copies from VSA-A. Checking both sides avoids trusting a single array view. This new direction belongs to the historical test result. It is not a claim about which site hosts the workload now, and it does not move the dashboard home-cluster baseline.'
