    visual: Healthy UI row vs actual progression evidence.
    narration: 'At about 10:14 UTC, the DRPC reached FailedOver with Completed progression and PeerReady true. PeerReady means the peer side had reached the state the controller required for this completion. Placement now selected spoke-0 only. The screenshot shows the healthy application row. The exact Completed progression comes from the recorded command evidence, not from guessing at the icon.'
