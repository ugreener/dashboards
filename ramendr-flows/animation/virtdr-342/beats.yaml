    narration: 'VSA-A now reported Source and normal replication for both workload sessions. Fresh reverse syncs were recorded at 10:14:27 and 10:15:47 UTC. The array interface displays those around thirteen fourteen and thirteen fifteen in UTC plus three. These are evidence of reverse copying, not a claim that two new scheduled syncs under load had already qualified the next failover.'
