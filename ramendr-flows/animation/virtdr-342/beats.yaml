  - id: '8.1'
    chapter: Complete and reverse protection
    visual: Four separate handoffs, do not collapse promotion and reprotect.
    narration: 'Completion must not blur four different handoffs. Target promotion made the replicas writable. Source demotion made the old site a peer. Storage reprotection arranged copying in the new direction. A fresh reverse sync then demonstrated that copying had resumed. Upstream code places the PowerStore reprotection action in resync handling, not simply in every demotion call.'
    evidence: [source-trace, phase-b-observations]
    unverified: Exact deployed RPC routing and array-action execution are not captured.
  - id: '8.2'
    chapter: Complete and reverse protection
    screenshot: 19-completed-hub-drpc-failedover-completed-row.png
    focus: {x: 260, y: 310, w: 1180, h: 480}
