  - id: '7.7'
    chapter: Resume and clean the old source
    visual: Source Secondary and target copies unchanged recap.
    narration: 'So far, the old source VM, its running instance, DataVolumes and owned claims are gone. The source VRG then became Secondary. The target claims stayed Bound to the same promoted VSA-A handles. With old disk use removed and the source reporting its new role, the hub could finish the recovery lifecycle.'
