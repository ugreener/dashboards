# ================= Chapter 12: cleaning up the source =================
- id: "12.1"
  chapter: Cleaning up the source
  visual: "Phase tracker: Clean up. Hub edits spoke-1 VRG ManifestWork to secondary; view sees accepted spec; spoke-1 removed from decision."
  narration: >
    Why clean up at all? The old disks must become replication destinations again, or the app is not protected for the next disaster.
    Ramen edits the spoke-1 V R G parcel to secondary. Once the view shows spoke-1 accepted that request, Ramen removes the retained spoke-1 entry from the decision.
  evidence: [ramen]

- id: "12.2"
  chapter: Cleaning up the source
  visual: "ApplicationSet no longer sees spoke-1; Application dell-vm-workload-spoke-1 fades; its ManifestWork removed."
  narration: >
    On its next poll the ApplicationSet no longer sees spoke-1, so it deletes dell-vm-workload-spoke-1.
    The propagation controller deletes that Application's parcel, and the Application disappears from spoke-1.
  evidence: [ramen, ocm, run]
  unverified: "The spoke-1 Application removal is recorded only as about 13:29 to 13:31."

- id: "12.3"
  chapter: Cleaning up the source
  t: "13:31:00"
  visual: "Spoke-1 Argo CD prunes: VM, DataVolumes, PVCs vanish. Namespace gitops-vms and VRG stay."
  narration: >
    On spoke-1, Argo CD prunes what it owned: the paused VM, its DataVolumes and their claims. No human deleted anything.
    The namespace stays, because Git never declared it and Ramen delivers it separately, and so does the V R G inside it.
  pause_after: 1.0
  evidence: [run]

- id: "12.4"
  chapter: Cleaning up the source
  visual: "Spoke-1 VRG lock: no pod uses the PVCs, no attachment; lock opens."
  narration: >
    The spoke-1 V R G was waiting for exactly this. It will not demote a disk while any pod uses it or it is still attached to a node.
    With the VM gone, that check passes.
  evidence: [ramen]

- id: "12.5"
  chapter: Cleaning up the source
  visual: "Spoke-1 VolumeReplications: secondary, Demote then Resync; finalizers released; PVCs gone; VRG Secondary."
  narration: >
    It sets both VolumeReplications to secondary. csi-addons calls Demote, then Resync. The V R G accepts that as a healthy Secondary,
    removes its finalizers, and the old claims finally finish deleting. The spoke-1 V R G reports Secondary.
  evidence: [ramen, csiaddons]

- id: "12.6"
  chapter: Cleaning up the source
  narration: >
    So far: the source workload is gone without manual deletion, and the source V R G is Secondary. The namespace survived, as designed.
  pause_after: 0.8
  evidence: [run]

