meta:
  title: "Anatomy of a failover: a GitOps-managed VM on Dell PowerStore with RamenDR"
  ticket: VIRTDR-292
  run_date: 2026-10-07
  direction: "spoke-1 (VSA-B) to spoke-0 (VSA-A, home cluster)"

beats:

# ================= Chapter 0: cold open =================
- id: "0.1"
  chapter: Cold open
  t: "13:26:40"
  visual: "Typed timestamp, click ripple, VM teaser moves between clusters, elapsed counter to +5m 41s."
  narration: >
    At 13:26:40 UTC on October 7th, someone clicked one button in a web console.
    Five minutes and forty-one seconds later, a running database virtual machine had moved
    from one OpenShift cluster to another, onto disks that two Dell storage arrays had been copying in the background.
    This video walks through everything that happened in between, one handoff at a time.
  pause_after: 1.8
  evidence: [run]

# ================= Chapter 1: cast of characters =================
- id: "1.1"
  chapter: Cast of characters
  visual: "Three cluster boxes: hub on top, two spokes below. Definition panel: hub and managed cluster."
  card: {kind: "Hub and managed clusters", name: "edge36 hub · spoke-0 · spoke-1", role: "one cluster manages the other two"}
  def:
    what: "Red Hat Advanced Cluster Management, ACM, runs on a hub cluster and manages other clusters, called managed clusters or spokes."
    creator: "Clusters are registered to the hub once, at setup."
    reader: "Every controller in this video runs on either the hub or a spoke."
    where: "Hub: edge36. spoke-0: edge95. spoke-1: edge97."
    analogy: "Head office and two branch offices."
  narration: >
    Before the failover, let's meet the cast. Everything in this story lives on three clusters.
    One hub cluster runs Advanced Cluster Management, A C M, and manages the other two, called managed clusters, or spokes.
    Think of a head office and two branch offices. The hub is edge36, spoke-0 is edge95, and spoke-1 is edge97.
  evidence: [setup]

- id: "1.2"
  chapter: Cast of characters
  card: {kind: VirtualMachine, name: hammerdb-rhel9, role: "the database VM we are protecting"}
  def:
    what: "OpenShift Virtualization runs full virtual machines as Kubernetes objects. A VirtualMachine is the definition; a VirtualMachineInstance, VMI, is the running copy inside a pod."
    creator: "Argo CD applies it from Git."
    reader: "KubeVirt starts a virt-launcher pod that runs the guest."
    where: "Namespace gitops-vms on whichever spoke runs the app."
    analogy: "The VirtualMachine is the recipe; the VMI is the dish on the table."
  narration: >
    The workload is a virtual machine. OpenShift Virtualization lets a cluster run full VMs as Kubernetes objects.
    A VirtualMachine is the definition, and a VirtualMachineInstance, or V M I, is the running copy, inside a pod.
    Ours is called hammerdb-rhel9. It runs PostgreSQL, and a load generator called HammerDB writes to it nonstop.
  evidence: [repo, setup]

- id: "1.3"
  chapter: Cast of characters
  card: {kind: DataVolume, name: hammerdb-rhel9-rootdisk, role: "creates and fills a VM disk"}
  def:
    what: "A DataVolume asks the Containerized Data Importer, CDI, to create a PersistentVolumeClaim and fill it, for example by cloning an OS image or leaving it blank."
    creator: "Argo CD applies two DataVolumes from Git: rootdisk and datadisk."
    reader: "CDI creates PVCs with the same names; the VM mounts them."
    where: "gitops-vms on the spoke."
    analogy: "An order form that says: give me a 35 gig disk, preloaded with RHEL."
  narration: >
    The VM has two disks, and each one starts life as a DataVolume. A DataVolume is an order form for a disk.
    It asks the importer, C D I, to create a persistent volume claim and fill it. The root disk clones a RHEL 9 image.
    The data disk starts blank. The resulting claims keep the same names, hammerdb-rhel9-rootdisk and hammerdb-rhel9-datadisk.
  evidence: [repo]

- id: "1.4"
  chapter: Cast of characters
  card: {kind: "PowerStore replication session", name: "VSA-B to VSA-A", role: "the array copies changed blocks"}
  def:
    what: "Each spoke stores its disks on its own Dell PowerStore virtual array. A replication session on the array copies a volume's changed blocks to the peer array on a schedule."
    creator: "The PowerStore CSI driver, when replication is enabled."
    reader: "The peer array keeps a read-only destination copy."
    where: "spoke-0 uses VSA-A, spoke-1 uses VSA-B, over NVMe over TCP."
    analogy: "A courier that drives a fresh copy of your files to the other office every few minutes."
  narration: >
    The bytes live on storage arrays. Each spoke uses its own Dell PowerStore virtual array: spoke-0 uses VSA-A, spoke-1 uses VSA-B.
    For each protected volume, the source array runs a replication session that copies changed blocks to the other array on a schedule.
    The copy on the far side is read-only until someone promotes it. Like a courier taking fresh copies to the other office.
  evidence: [setup]

- id: "1.5"
  chapter: Cast of characters
  card: {kind: VolumeReplicationClass, name: powerstore-vrc-15m, role: "says how often to replicate"}
  def:
    what: "A cluster-scoped class that tells the storage driver which replication settings to use, here a 15 minute schedule."
    creator: "Created once on each spoke during setup."
    reader: "csi-addons passes its parameters to the PowerStore driver."
    where: "Cluster-scoped, on each spoke."
    analogy: "The courier's timetable."
  narration: >
    How often the courier drives is set by a VolumeReplicationClass. It is a cluster-wide settings object on each spoke.
    Ours is powerstore-vrc-15m, a fifteen minute schedule. It does nothing by itself.
    It is the timetable that the next object points at.
  evidence: [setup]

- id: "1.6"
  chapter: Cast of characters
  card: {kind: VolumeReplication, name: hammerdb-rhel9-datadisk, role: "turns replication on for one PVC"}
  def:
    what: "Asks for one PVC's volume to be replicated, and in which role: primary means writable source, secondary means read-only destination."
    creator: "Ramen's VolumeReplicationGroup creates one per protected PVC."
    reader: "The csi-addons controller translates it into gRPC calls on the PowerStore CSI driver."
    where: "Same namespace as the PVC, on the spoke."
    analogy: "A work order for the courier: this disk, this timetable, you are the sender."
  narration: >
    A VolumeReplication turns replication on for one claim. It names the claim, the class, and a role.
    Primary means this side is the writable source. Secondary means this side is the read-only destination.
    A controller called csi-addons reads it and makes the matching calls on the PowerStore storage driver.
  evidence: [csiaddons, ramen]

- id: "1.7"
  chapter: Cast of characters
  card: {kind: VolumeReplicationGroup, name: dell-vm-drpc, role: "protects all the app's disks on one spoke"}
  def:
    what: "Ramen's per-spoke object for one application. It finds the app's PVCs by label, creates their VolumeReplications, and saves their definitions to S3. Its state is Primary or Secondary."
    creator: "The hub delivers it to both spokes."
    reader: "Ramen's spoke controller acts on it; the hub reads its status back."
    where: "gitops-vms on each spoke."
    analogy: "A site manager at each office who knows which boxes belong to this customer."
  narration: >
    Grouping those per-disk orders is the VolumeReplicationGroup, or V R G. Ramen is the disaster recovery operator here,
    and the V R G is its site manager on each spoke. It finds the app's claims by label and creates their VolumeReplications.
    One spoke's V R G is Primary, running the app. The other is Secondary, standing by.
  evidence: [ramen]

- id: "1.8"
  chapter: Cast of characters
  card: {kind: "S3 bucket", name: ramen-metadata, role: "remembers which disk belongs to which claim"}
  def:
    what: "An S3 bucket, served by MinIO on the hub, where Ramen stores copies of the protected PV and PVC definitions."
    creator: "The Primary VRG uploads them."
    reader: "A VRG that becomes Primary on the other spoke downloads them."
    where: "MinIO on the hub, bucket ramen-metadata."
    analogy: "The labels for the boxes, kept in a safe at head office."
  narration: >
    Copied bytes alone are not enough. The other cluster also needs to know which volume belongs to which claim.
    So the Primary V R G uploads the persistent volume and claim definitions to an S3 bucket called ramen-metadata,
    served by MinIO on the hub. These are the labels for the boxes, kept in head office's safe.
  evidence: [ramen, setup]

- id: "1.9"
  chapter: Cast of characters
  card: {kind: DRPolicy, name: dr-policy-15m, role: "pairs the two spokes, 15 minute schedule"}
  def:
    what: "A cluster-scoped hub object that names the two peer clusters and the replication interval."
    creator: "Created once on the hub during setup."
    reader: "Each DRPlacementControl points at one DRPolicy."
    where: "Hub, cluster-scoped."
    analogy: "The contract between the two branch offices."
  narration: >
    On the hub, a DRPolicy names the pair of clusters that back each other up, and the replication interval.
    Ours is dr-policy-15m: spoke-0 and spoke-1, every fifteen minutes. That interval is also our recovery point objective,
    or R P O: the most recent writes we can afford to lose, here 900 seconds.
  evidence: [run, setup]

- id: "1.10"
  chapter: Cast of characters
  card: {kind: Placement, name: dell-vm-placement, role: "the question: which cluster runs this app?"}
  def:
    what: "An ACM object that asks which clusters an application should run on."
    creator: "Applied from Git into openshift-gitops on the hub."
    reader: "Normally the ACM scheduler answers it. Here an annotation switches that off, so only Ramen answers."
    where: "Hub, namespace openshift-gitops."
    analogy: "A job posting: we need one office to run this."
  narration: >
    Now the hub objects that decide where the app runs. A Placement is a question: which cluster should run this app?
    Normally A C M's scheduler answers it. Ours is dell-vm-placement, and an annotation switches the scheduler off for it,
    so that only Ramen gets to answer.
  evidence: [repo]

- id: "1.11"
  chapter: Cast of characters
  card: {kind: PlacementDecision, name: dell-vm-placement-decision-1, role: "the answer: the chosen cluster list"}
  def:
    what: "The answer to a Placement: a list of selected cluster names."
    creator: "Here, written only by Ramen's hub operator."
    reader: "The ApplicationSet generator polls it to decide where to deploy."
    where: "Hub, openshift-gitops, labeled with the Placement name."
    analogy: "The posted result: office spoke-1 gets the job."
  narration: >
    The answer is a PlacementDecision: a short list of cluster names. Ramen writes it, and GitOps reads it.
    That single list is the hinge of this whole story. When it changes, the app moves.
    Ours is dell-vm-placement-decision-1.
  evidence: [ramen, argocd]

- id: "1.12"
  chapter: Cast of characters
  card: {kind: DRPlacementControl, name: dell-vm-drpc, role: "the DR control panel for one app"}
  def:
    what: "Ramen's hub object for one protected application. It points at a Placement and a DRPolicy, selects PVCs by label, and accepts actions like Failover."
    creator: "Applied from Git; the console edits its action field."
    reader: "Ramen's hub operator reconciles it and reports phase and conditions."
    where: "Hub, openshift-gitops, next to its Placement."
    analogy: "The control panel with the big red failover switch."
  narration: >
    Tying it together is the DRPlacementControl, or D R P C: Ramen's control panel for one app.
    Ours is dell-vm-drpc. It points at the Placement and the DRPolicy, and selects disks with the label drprotection equals true.
    When you press Failover in the console, the console writes into this object.
  evidence: [repo, ramen]

- id: "1.13"
  chapter: Cast of characters
  card: {kind: ManifestWork, name: "dell-vm-drpc-gitops-vms-vrg-mw", role: "a parcel the hub ships to a spoke"}
  def:
    what: "An ACM object on the hub that wraps Kubernetes manifests. The work agent on the named spoke applies them there."
    creator: "Ramen (for VRGs) and the GitOps propagation controller (for Applications)."
    reader: "The work agent on the spoke."
    where: "Hub, in the spoke's cluster namespace."
    analogy: "A sealed parcel addressed to one branch office."
  narration: >
    The hub never edits spoke objects directly. Instead it writes a ManifestWork: a parcel of manifests addressed to one spoke.
    A work agent on that spoke unpacks it and applies the contents. Ramen ships each V R G this way,
    in a parcel called dell-vm-drpc-gitops-vms-vrg-mw, one per spoke.
  evidence: [ramen, live]

- id: "1.14"
  chapter: Cast of characters
  card: {kind: ManagedClusterView, name: dell-vm-drpc-gitops-vms-vrg-mcv, role: "a window to read spoke status"}
  def:
    what: "An ACM object on the hub that asks a spoke for the current copy of one of its objects."
    creator: "Ramen's hub operator."
    reader: "Ramen reads the returned VRG status to decide its next step."
    where: "Hub, in the spoke's cluster namespace."
    analogy: "A status report the branch office faxes back."
  narration: >
    Going the other way, a ManagedClusterView is a window. It asks a spoke for the current copy of one object
    and brings it back to the hub. Ramen reads each V R G's status through views like dell-vm-drpc-gitops-vms-vrg-mcv.
    Shipping a parcel and seeing the result are always two separate steps.
  evidence: [ramen]

- id: "1.15"
  chapter: Cast of characters
  card: {kind: ApplicationSet, name: dell-vm-workload, role: "stamps out one Application per chosen cluster"}
  def:
    what: "An Argo CD object that generates Applications from a template. Our generator reads the PlacementDecision."
    creator: "Applied from Git into openshift-gitops on the hub."
    reader: "The ApplicationSet controller polls the decision every 180 seconds."
    where: "Hub, openshift-gitops."
    analogy: "A mail-merge: one letter per name on the list."
  narration: >
    Now GitOps. Argo CD deploys things from Git. An ApplicationSet is a mail-merge: a template, plus a list of targets.
    Ours, dell-vm-workload, takes its list from the PlacementDecision, and checks it every 180 seconds.
    For each cluster on the list, it stamps out one Application.
  evidence: [repo, argocd]

- id: "1.16"
  chapter: Cast of characters
  card: {kind: Application, name: dell-vm-workload-spoke-0, role: "deploy this Git folder to that cluster"}
  def:
    what: "An Argo CD object: sync this Git path to this cluster and namespace, and keep it that way."
    creator: "Generated by the ApplicationSet, one per selected cluster."
    reader: "Argo CD on the spoke syncs it (pull model)."
    where: "Hub copy in openshift-gitops, delivered to the spoke's openshift-gitops."
    analogy: "One mail-merged letter: office spoke-0, build exactly what is in this folder."
  narration: >
    An Application says: make this cluster match this Git folder, and keep it that way.
    Ours are named dell-vm-workload, a dash, and the cluster name, so dell-vm-workload-spoke-0 or dell-vm-workload-spoke-1.
    If something in Git is removed, Argo CD removes it from the cluster too. That is called pruning.
  evidence: [repo]

- id: "1.17"
  chapter: Cast of characters
  visual: "All glossary cards in a grid, grouped: workload, storage, DR control, GitOps."
  narration: >
    That is the whole cast. The workload: a VirtualMachine and its DataVolumes. Storage: arrays, VolumeReplications, and their group.
    D R control: a DRPolicy, a D R P C, a Placement, and its decision. Delivery: ManifestWorks and views.
    And GitOps: an ApplicationSet and its Applications. Now let's place them on the map.
  pause_after: 1.4
  evidence: [repo, ramen]

# ================= Chapter 2: the environment =================
- id: "2.1"
  chapter: The environment
  visual: "Full topology fades in: hub, spoke-1, spoke-0, VSA-B, VSA-A, MinIO."
  narration: >
    Why look at the map first? Because a failover is a relay race between controllers on different clusters,
    and you can only follow the baton if you know where each runner stands.
    Here is the hub on top, the two spokes below, and each spoke's array underneath, linked by asynchronous replication.
  evidence: [setup]

- id: "2.2"
  chapter: The environment
  visual: "Zoom into spoke-1: VM hammerdb-rhel9, two PVCs with drprotection=true."
  narration: >
    In this recorded run the VM started on spoke-1, so the test failed over from spoke-1 to spoke-0, which is the app's home cluster.
    In the gitops-vms namespace: the VM, its 35 gig root disk claim and its 20 gig data disk claim,
    both labeled drprotection equals true. That label is how Ramen will find them.
  evidence: [run, repo]

- id: "2.3"
  chapter: The environment
  visual: "Git card; hub namespace openshift-gitops: Placement, DRPC, ApplicationSet, PlacementDecision, DRPolicy."
  narration: >
    The VM's definition lives in Git, on the ocp-4.22-rhdr-dell branch, under clusters/dell-s4/workloads.
    On the hub, in openshift-gitops, sit the Placement, the D R P C, the ApplicationSet and the PlacementDecision,
    with the DRPolicy alongside. All three app objects share one namespace on purpose: Ramen and Argo CD each require it.
  evidence: [repo]

- id: "2.4"
  chapter: The environment
  visual: "Placement annotation highlighted; ACM scheduler chip greys out; Ramen chip becomes only writer."
  narration: >
    Look at the Placement's annotation, experimental-scheduling-disable. It switches off A C M's automatic choice,
    so only Ramen writes the decision. Lose it, and the D R P C refuses to work.
    That happened once in this lab: deleting the D R P C made Ramen strip the annotation, and it had to be re-applied.
  evidence: [repo, notes]

- id: "2.5"
  chapter: The environment
  visual: "ApplicationSet YAML: clusterDecisionResource, acm-placement, requeueAfterSeconds 180."
  narration: >
    The ApplicationSet uses the cluster decision resource generator. Through the acm-placement config map
    it knows how to read our PlacementDecision, and it re-reads it every 180 seconds.
    That is a polling interval, not a promise of delivery time. Keep that number in mind.
  pause_after: 1.4
  evidence: [repo, argocd]

- id: "2.6"
  chapter: The environment
  visual: "Application dell-vm-workload-spoke-1 travels in a ManifestWork to spoke-1; spoke Argo CD pulls Git and syncs the VM."
  define: {term: "pull model", text: "The hub only generates the Application. The spoke's own Argo CD does the sync."}
  narration: >
    This is the pull model. The hub copy of the Application carries a skip-reconcile annotation, so the hub's Argo CD leaves it alone.
    A propagation controller packs it into a ManifestWork for the chosen spoke, the work agent applies it,
    and the spoke's own Argo CD pulls the Git folder and syncs it, with automatic prune and self-heal.
  evidence: [repo, ocm]

- id: "2.7"
  chapter: The environment
  visual: "Git card: 'no namespace.yaml' highlighted; YAML syncOptions CreateNamespace=true."
  narration: >
    One deliberate omission: the Git folder has no namespace manifest. Argo CD creates gitops-vms if needed, but does not own it.
    An earlier attempt did own it. On failover Argo CD deleted the whole namespace on the source,
    taking Ramen's V R G with it mid-handoff, and the failover got stuck.
  evidence: [repo, notes]

- id: "2.8"
  chapter: The environment
  narration: >
    So far: three clusters, two arrays, one Git folder. On the hub, a D R P C and a Placement whose decision only Ramen writes,
    and an ApplicationSet that turns that decision into a deployed VM on whichever spoke is listed.
  pause_after: 1.2
  evidence: [repo]

# ================= Chapter 3: protected steady state =================
- id: "3.1"
  chapter: Protected steady state
  visual: "Overview; phase tracker appears with 'Protect' highlighted."
  narration: >
    Before anything fails, what does protected actually mean? If protection is incomplete,
    a failover would bring back disks with missing data, or disks the target cluster cannot even attach.
    Protection has three parts: two V R Gs, replicated volumes, and saved storage definitions.
  evidence: [ramen]

- id: "3.2"
  chapter: Protected steady state
  visual: "Hub Ramen ships two ManifestWorks: VRG Primary to spoke-1, VRG Secondary to spoke-0; status returns via views."
  narration: >
    The hub's Ramen operator ships a V R G parcel to each spoke. On spoke-1, where the VM runs, the V R G is Primary.
    On spoke-0 it is Secondary. The work agents apply them, and Ramen watches their status through ManagedClusterViews.
  evidence: [ramen, run]

- id: "3.3"
  chapter: Protected steady state
  visual: "Primary VRG selects both PVCs; badges 'Protected PVC'; two VolumeReplications appear."
  define: {term: "finalizer", text: "A tag that blocks deletion of an object until a controller removes it."}
  narration: >
    The Primary V R G selects claims labeled drprotection equals true. On each it adds a finalizer, a tag that blocks deletion until Ramen lets go,
    and sets the volume to be retained if the claim is deleted. Then it creates one VolumeReplication per claim, role primary,
    using powerstore-vrc-15m.
  evidence: [ramen, setup]

- id: "3.4"
  chapter: Protected steady state
  visual: "csi-addons chip to VSA-B volumes; replication sessions to VSA-A replicas pulse."
  narration: >
    csi-addons sees each VolumeReplication and asks the PowerStore driver to enable replication.
    VSA-B now runs one session per disk toward VSA-A. With a fifteen minute rule, these sessions synced about every twelve minutes in this run.
  pause_after: 1.0
  evidence: [csiaddons, run, setup]

- id: "3.5"
  chapter: Protected steady state
  visual: "PV and PVC YAML fly from spoke-1 to the ramen-metadata bucket; condition ClusterDataProtected True."
  narration: >
    Finally the V R G uploads the volume and claim definitions to the ramen-metadata bucket, including which replica volume belongs to which claim.
    When that upload succeeds, it reports the condition ClusterDataProtected as true.
  pause_after: 1.2
  evidence: [ramen, setup]

- id: "3.6"
  chapter: Protected steady state
  narration: >
    So far: a Primary V R G on spoke-1 and a Secondary on spoke-0, both disks replicating from VSA-B to VSA-A,
    and their definitions saved in S3. The hub sums this up on the D R P C as Protected.
  pause_after: 1.2
  evidence: [ramen, run]

# ================= Chapter 4: preflight gate =================
- id: "4.1"
  chapter: Preflight gate
  visual: "Phase tracker: Gate. Flashback card October 6: rootdisk ticks; datadisk misses a tick; console shows Ready."
  narration: >
    Why check anything before pressing the button? Because the day before, the same test lost data.
    The array ran the data disk's first sync, then silently skipped the next scheduled one. No failed job, no alert, session state OK.
    Fifteen minutes of writes were missing after failover.
  pause_after: 1.2
  evidence: [run, notes]

- id: "4.2"
  chapter: Preflight gate
  screenshot: VIRTDR-292-2026-10-07-21-pre-initiate-hub-managed-status.png
  focus: {x: 925, y: 400, w: 330, h: 220}
  caption: "Before Initiate · status popover: All volumes are synced, last synced 13:15 UTC"
  narration: >
    And the console could not see it. This is the console just before this run's failover, in the Protected applications list,
    where the row is labeled with the ApplicationSet name, dell-vm-workload. It says all volumes are synced.
    But the Dell driver reports the current time as the last sync time, so this view cannot catch a skipped sync.
  evidence: [shot, powerstore]

- id: "4.3"
  chapter: Preflight gate
  visual: "Preflight checklist: 24 of 24; per-disk sync history; rows per interval."
  narration: >
    So the gate is a script that reads the array's own job history. At 13:15:58 it passed 24 of 24 checks.
    Each disk had 87 completed scheduled syncs, no failures, every gap under 900 seconds.
    And the last two sync intervals each carried real writes: 57,767 and 59,673 database rows.
  evidence: [run]

- id: "4.4"
  chapter: Preflight gate
  visual: "Two clocks: preflight 13:15:58, Initiate 13:26:40; '10m 42s' versus 'valid 2 min' in amber."
  narration: >
    One honest caveat. The gate is valid for only two minutes, and this recorded preflight finished more than ten minutes before the click.
    The attachments show no fresh scripted pass inside that window. The run's recovery passed, but its timing is not an example of the required procedure.
  pause_after: 1.4
  evidence: [run]

- id: "4.5"
  chapter: Preflight gate
  narration: >
    So far: the console's synced badge is not proof. Only the array's job history shows that every disk synced recently, and that those syncs carried writes.
  pause_after: 1.0
  evidence: [run, notes]

# ================= Chapter 5: initiate =================
- id: "5.1"
  chapter: Initiate
  t: "13:22:27"
  visual: "Phase tracker: Initiate. Both VSA-B sessions tick 'COMPLETED 13:22:27'; marker 'recovery point'."
  define: {term: "recovery point", text: "The moment the newest copy on the other array was taken. Writes after it are not on the replica."}
  narration: >
    Why mark this moment? Because in an unplanned failover the target only has what the last sync carried.
    At 13:22:27 both disks completed a scheduled sync. Nobody knew it yet, but this was the recovery point.
  pause_after: 1.6
