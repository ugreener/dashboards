# ================= Chapter 14: what did we lose =================
- id: "14.1"
  chapter: What did we lose
  visual: "Phase tracker: Verify data. Bar chart of recovered rows per minute."
  narration: >
    Why measure, if it is green? Because asynchronous replication always loses something. The question is how much.
    The history table on the recovered database records every transaction's time. Counting rows per minute shows a steady stream until 13:22.
  evidence: [run]

- id: "14.2"
  chapter: What did we lose
  visual: "13:22 bar cut at 13:22:27; empty 13:23 to 13:30; small 13:31 bar in a new color."
  narration: >
    The 13:22 bar is cut off at exactly 13:22:27, the last array sync. Then nothing until 13:31, when the new writer starts.
    The gap between the last recovered row and the first new one is 550 seconds.
  evidence: [run]

- id: "14.3"
  chapter: What did we lose
  visual: "Ruler: green band 277,433 rows recovered; red band 13:22:27 to 13:26:44 lost; RPO bar 900 s."
  narration: >
    All 277,433 rows from the 59 full minutes before that sync are present. The writes between 13:22:27 and the pause at 13:26:44 are gone.
    That is a recovery point 253 seconds before the click, inside the 900 second R P O. A pass, but not zero loss.
  pause_after: 1.8
  evidence: [run]

- id: "14.4"
  chapter: What did we lose
  narration: >
    So far: every row up to the recovery point survived, and about four minutes of writes after it were lost, within policy.
  pause_after: 0.8
  evidence: [run]

# ================= Chapter 15: after the failover =================
- id: "15.1"
  chapter: After the failover
  t: "13:42:00"
  visual: "Reversed sessions: rootdisk ticks 13:36:57; datadisk still 13:22:27 at 13:42, warning."
  narration: >
    Why keep watching afterwards? Right after the reversal, the root disk synced at 13:36:57, but at 13:42 the data disk still had not.
    That looks like the same first-sync skip as the day before. So the two-sync gate must pass again before anyone moves the app back.
  evidence: [run, notes]

- id: "15.2"
  chapter: After the failover
  visual: "Guest: ramendr-dr-hammerdb.service disabled, ramendr-postgresql.service active, sum stable 1,443,612."
  narration: >
    To finish the test, the writer was stopped and disabled, while PostgreSQL stayed running so the data remained queryable.
    The order counter stayed at 1,443,612. That is an order-sequence total, not an exact transaction count.
  evidence: [run]

- id: "15.3"
  chapter: After the failover
  visual: "Full-chain recap: phases light up in order on the topology."
  narration: >
    Let's replay it. Protect: two V R Gs, replicating disks, definitions in S3. Gate: the array's own sync history.
    Initiate: two fields on the D R P C. Validate: the target is checked and the source is kept. Promote: definitions restored, replicas made writable.
  evidence: [run, ramen]

- id: "15.4"
  chapter: After the failover
  visual: "Recap continues: switch placement, redeploy, clean up, complete, verify."
  narration: >
    Switch placement: the decision gains spoke-0. Redeploy: the ApplicationSet polls, and Argo CD builds the VM on the recovered disks.
    Clean up: Argo CD prunes the source, and its V R G becomes Secondary. Complete: PeerReady. Verify: rows, not badges.
  evidence: [run, ramen]

- id: "15.5"
  chapter: After the failover
  visual: "Result card: 5m41s, recovery point 253 s before Initiate, within 900 s, not zero loss."
  narration: >
    The result: five minutes and forty-one seconds from click to completion, a recovery point 253 seconds before the click, within the fifteen minute objective,
    with no manual cleanup. Each controller only did its own small job. That is what makes it work, and what you debug when it does not.
  pause_after: 2.5
  evidence: [run]
