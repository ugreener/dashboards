# ================= Chapter 6: hub checks the target =================
- id: "6.1"
  chapter: Hub checks the target
  visual: "Phase tracker: Validate. DRPC status: phase FailingOver, PeerReady False."
  define: {term: "PeerReady", text: "True when both clusters are settled and another DR action is allowed."}
  narration: >
    Why check before acting? Promoting a target that is not ready would leave the app with nowhere to run.
    Ramen first confirms that spoke-0's V R G exists and is a settled Secondary. It sets the phase to FailingOver
    and PeerReady to false, meaning no other D R action may start now.
  evidence: [ramen]

- id: "6.2"
  chapter: Hub checks the target
  visual: "Progression ticker: CheckingFailoverPrerequisites, then FailingOverToCluster; Metro-only fencing step greyed."
  narration: >
    This is Regional D R, with asynchronous arrays, so there is no fencing step that locks the old site out.
    Ramen checks whether the storage needs a maintenance mode first. Here it does not, and moves on.
  evidence: [ramen]
  unverified: "Individual progression timestamps were not recorded in this run."

- id: "6.3"
  chapter: Hub checks the target
  visual: "PlacementDecision: spoke-1 entry tagged RetainedForFailover."
  define: {term: "RetainedForFailover", text: "Ramen keeps the source in the decision on purpose until the target is ready."}
  narration: >
    Next, a subtle move. Ramen does not remove spoke-1 from the PlacementDecision. It tags the entry RetainedForFailover.
    If it removed it now, Argo CD would start deleting the source VM before the target could run anything.
  evidence: [ramen]

- id: "6.4"
  chapter: Hub checks the target
  visual: "Hub edits spoke-0 VRG ManifestWork: replicationState primary, action Failover; parcel flies to spoke-0."
  narration: >
    Then it edits the V R G parcel for spoke-0: become primary, because of a failover. The work agent on spoke-0 applies it.
    The D R P C progression becomes WaitingForResourceRestore.
  evidence: [ramen]

- id: "6.5"
  chapter: Hub checks the target
  narration: >
    So far: the target is checked, the source is kept on the list on purpose, and spoke-0 has been told to become Primary.
  pause_after: 0.8
  evidence: [ramen]

# ================= Chapter 7: promotion on spoke-0 =================
- id: "7.1"
  chapter: Promotion on spoke-0
  visual: "Phase tracker: Promote. Spoke-0 VRG flips to Primary; arrow up to MinIO; PV/PVC definitions descend."
  narration: >
    Why restore definitions first? The replica volumes on VSA-A exist, but spoke-0 has no claims that point at them.
    So the spoke-0 V R G, acting as Primary, downloads the saved volume and claim definitions from S3
    and recreates them, pointing at the replica volume handles on VSA-A.
  evidence: [ramen]

- id: "7.2"
  chapter: Promotion on spoke-0
  visual: "Restored PVC cards appear on spoke-0; VRG condition ClusterDataReady True."
  narration: >
    The condition ClusterDataReady goes true: the storage definitions are back. It does not by itself prove every claim is bound.
    In this run the target volume handles were separately confirmed to be the promoted replicas.
  evidence: [ramen, run]

- id: "7.3"
  chapter: Promotion on spoke-0
  visual: "Two VolumeReplications on spoke-0, role primary; csi-addons sends Promote to PowerStore CSI."
  narration: >
    Next the V R G creates two VolumeReplications with role primary. csi-addons calls Promote on the PowerStore driver.
    It tries a normal promote first, and only retries with force if the driver refuses.
  evidence: [ramen, csiaddons]
  unverified: "Which promote variant PowerStore needed in this run is not recorded."

- id: "7.4"
  chapter: Promotion on spoke-0
  visual: "VSA-A volumes switch role pill to 'writable'; VSA-B sessions flagged 'failed over'."
  narration: >
    On the arrays, failover makes the VSA-A copies writable. That is not yet replication in the opposite direction.
    Reversing the sessions is a separate step that we will see near the end.
  evidence: [setup, powerstore]
  unverified: "Exact PowerStore RPC sequence and deployed-driver build were not captured."

- id: "7.5"
