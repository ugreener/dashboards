# ================= Chapter 10: GitOps redeploys =================
- id: "10.1"
  chapter: GitOps redeploys
  visual: "Phase tracker: Redeploy. ApplicationSet clock counts down from 180; reads decision; generates dell-vm-workload-spoke-0."
  narration: >
    Why can there be a pause here? Because nobody pushes the change to GitOps. The ApplicationSet discovers it on its next poll.
    When it re-reads the decision, it finds spoke-0 and stamps out a second Application, dell-vm-workload-spoke-0.
  evidence: [argocd, run]
  unverified: "Generation time is recorded only as about 13:29; attributing the wait to the 180 s poll is inferred."

- id: "10.2"
  chapter: GitOps redeploys
  visual: "Propagation controller wraps Application in ManifestWork to spoke-0; Argo CD on spoke-0 pulls Git."
  narration: >
    The propagation controller packs it into a ManifestWork for spoke-0 and points it at spoke-0's local A P I server.
    The work agent applies it, and spoke-0's Argo CD pulls clusters/dell-s4/workloads from Git.
  evidence: [ocm, repo]

- id: "10.3"
  chapter: GitOps redeploys
  visual: "DataVolume manifests meet existing restored PVCs; green 'reuse' link instead of a fresh clone."
  narration: >
    Here the restore pays off. The root disk DataVolume says: clone a fresh RHEL image. But claims with those exact names already exist,
    restored by Ramen and bound to the replicas. So the recovered disks are used, not overwritten by a blank or freshly cloned disk.
  pause_after: 1.2
  evidence: [run, repo]
  unverified: "Replica reuse is recorded through volume handles and recovered rows; the exact CDI adoption sequence was not traced."

- id: "10.4"
