# yamllint disable rule:line-length
ticket: VIRTDR-307
run: 2026-09-26
direction: planned failover ocp-primary to ocp-secondary, stopped at WaitForReadiness
beats:
  - id: "0.1"
    chapter: Cold open
    t: "21:51:28"
    visual: Split screen. The hub console popover on one side, the empty target namespace on the other.
    narration: "This is the story of a scheduled move that stopped halfway. An application ran at one site. Every two minutes its disks were copied to a second site. When the team asked the second site to take over, the copy was there, but the application did not start. Nothing was lost. The handover failed."
    evidence: [screenshot, drpc-status, vm-inventory]
    pause_after: 1.6

  - id: "0.2"
    chapter: Cold open
    t: "21:35:32"
    visual: DRPC conditions table, one row per condition.
    narration: "The console said Failover complete, meaning the move had finished. The application was not running. On the target, six of the eight disk claims, the tickets that ask for a disk, were marked Lost and two were Pending. No virtual machine existed. The object that drives recovery had been waiting for more than an hour."
    evidence: [drpc-status, drpc-list]
    pause_after: 1.0

  - id: "0.3"
    chapter: Cold open
    visual: Scope card naming the environment and the limit of the recording.
    narration: "This is a recorded failure from a lab that used OpenShift Data Foundation on AWS, not the Dell PowerStore lab. The storage copy was healthy. What failed was the rebuilding of the objects that describe the disks, and the step that hands each disk to its claim. Where this video infers a cause, it says so."
    evidence: [versions, vm-inventory]
    pause_after: 1.2

  - id: "0.4"
    chapter: Cold open
    visual: Three numbered layers, with the data copy green and the paperwork and handover marked as the problem area.
    narration: "The video follows three layers. First the data copy, which worked. Then the paperwork, which maps each disk to a claim. Then the handover, where Kubernetes binds the claim and starts the machine. Keep those three in mind, and every object has a place to sit. Every term is defined before it is used."
    evidence: [drpc-status, source-trace]
    concept:
      title: "Three layers, one handover"
      rows:
        - k: "1 · Data copy"
          t: "Every two minutes the changed blocks of each disk are sent to the second site. This layer worked."
          c: green
        - k: "2 · Paperwork"
          t: "The Kubernetes objects that say which disk belongs to which claim are saved off site and rebuilt on the target."
          c: amber
        - k: "3 · Handover"
          t: "Kubernetes binds each claim to its volume record, then the virtual machine can start. This is where the run stopped."
          c: red
    pause_after: 1.4

  - id: "1.1"
    chapter: The words you need
    visual: Card and definition for the three clusters.
    narration: "Three clusters. A small manager called the hub, and two application sites, ocp-primary and ocp-secondary. The sites are also called spokes, because they connect back to the hub. The hub holds the decisions and the records. The sites hold the applications and their disks."
    evidence: [source-trace, versions]
    card:
      kind: Cluster
      name: hub, ocp-primary, ocp-secondary
      role: one manager and two application sites
    def:
      what: "A cluster is a set of machines that Kubernetes runs on. The hub manages. ocp-primary and ocp-secondary run the application."
      creator: "The lab team installed all three."
      reader: "Every object in this video is stored in one of these clusters."
      where: "Three separate clusters, each with its own API server."
      analogy: "A head office and two factories."

  - id: "1.2"
    chapter: The words you need
    visual: Card and definition for the virtual machine, with its root disk and data disk drawn outside the machine.
    narration: "Start with the machine that matters: a virtual machine called rhel9-node-001. It is a computer running inside the cluster, with its own operating system. Its disks are not inside the computer. They are large files on the cluster's storage, and the cluster hands them to the machine at start-up. Kubernetes keeps one application's objects together in a namespace, here gitops-vms."
    evidence: [vm-inventory, pvc-primary]
    card:
      kind: VirtualMachine
      name: rhel9-node-001
      role: a computer that runs inside the cluster
    def:
      what: "A virtual machine is a computer running as a process inside the cluster. Its disks live on the cluster's storage, not inside the machine."
      creator: "The virtualization layer, from a VirtualMachine object."
      reader: "Users connect to it, and Ramen protects its disks."
      where: "ocp-primary, namespace gitops-vms."
      analogy: "A desk in an office. The desk is in the building, the filing cabinet is in the basement."

  - id: "1.3"
    chapter: The words you need
    visual: Card and definition for the claim, with its two disks named.
    narration: "The machine does not ask for a file path. It asks for a claim: a small object that says I need a disk of this size. On screen this is the PersistentVolumeClaim. Each machine has a root disk for its operating system and a data disk for its data, so four machines produce eight claims."
    evidence: [pvc-primary]
    card:
      kind: PersistentVolumeClaim
      name: rhel9-node-001
      role: the machine's request for a disk
    def:
      what: "A claim is a namespaced object that says this workload needs a disk of this size. It is the only storage object the workload refers to."
      creator: "KubeVirt, or the GitOps tooling that deploys the machine."
      reader: "The pod that runs the machine, and Ramen."
      where: "ocp-primary, namespace gitops-vms."
      analogy: "A claim ticket at a cloakroom."

  - id: "1.4"
    chapter: The words you need
    visual: Card and definition for the volume record.
    narration: "The claim is only a ticket. The real disk is represented by a second object, the PersistentVolume. It is cluster-wide and has no namespace. It holds two things that matter here: the ID of the real disk, and the name of the claim that owns it. The claim is the ticket, the volume record is the ledger entry."
    evidence: [pv-secondary, pv-handles]
    card:
      kind: PersistentVolume
      name: pvc-47291817-f92a-40a0-bf59-123465a72aae
      role: the cluster-wide record of one real disk
    def:
      what: "A volume record represents one real disk. It holds the disk's ID and the name of the claim that owns it."
      creator: "The storage provisioner, when the claim is first bound."
      reader: "The claim controller, kubelet, and the storage driver."
      where: "Cluster scope, so it has no namespace."
      analogy: "The cloakroom's own ledger entry for one coat."

  - id: "1.5"
    chapter: The words you need
    visual: Card and definition for the disk ID field.
    narration: "The disk ID is a field called spec.csi.volumeHandle. It is the serial number the storage driver uses to find the real image, and it belongs to one storage system. A copy of the disk at the other site has a different ID. If the record points at the old ID, the driver is looking in the wrong warehouse."
    evidence: [pv-handles, source-trace]
    card:
      kind: PV field
      name: spec.csi.volumeHandle
      role: the disk's ID on the storage system
    def:
      what: "The volume handle is the ID the storage driver uses to find the real disk. It names one image on one storage system."
      creator: "The storage driver, when it creates the disk."
      reader: "The storage driver, every time a pod needs the disk attached."
      where: "Inside every PersistentVolume."
      analogy: "The serial number of the locker, not the name on the ticket."

  - id: "1.6"
    chapter: The words you need
    visual: Card and definition for the binding controller.
    narration: "Binding is the clerk's job. The persistent volume controller compares the claim's name, namespace and UID with the volume record's claim reference. UID is the unique ID Kubernetes gives every object. If they match, the claim becomes Bound. If they do not, the claim is not usable, even when the disk is sitting right there."
    evidence: [k8s-source, events]
    card:
      kind: Controller
      name: persistent volume controller
      role: matches each claim to a volume record
    def:
      what: "This Kubernetes controller decides which claim owns which volume record. It compares the claim's name, namespace and UID with the record's claim reference."
      creator: "The Kubernetes control plane."
      reader: "Anyone who reads a claim's phase."
      where: "Each cluster's control plane."
      analogy: "The clerk who checks the name on the ticket against the name in the ledger."

  - id: "1.7"
    chapter: The words you need
    visual: Card and definition for the periodic copy.
    narration: "Protection adds a copy. Every two minutes, the storage driver sends the changed blocks of each protected disk to the other site. That copy is a real disk image, but it is not mounted and it is not running. It is a spare. It only becomes usable after the target promotes it, and promotion is the move we are about to watch."
    evidence: [drpolicy, vrg-secondary]
    card:
      kind: DR copy
      name: 2m-vm · every two minutes
      role: a repeated copy of each disk at the other site
    def:
      what: "Replication means the storage system sends changed blocks of every protected disk to the other site on a schedule. The copy is a real disk image, not a running machine."
      creator: "The storage driver, following the DRPolicy schedule."
      reader: "The target storage, and the DR objects that promote it."
      where: "Between the storage systems of the two clusters."
      analogy: "A photocopy of the ledger sent to the branch office every two minutes."

  - id: "1.8"
    chapter: The words you need
    visual: Card and definition for the archive.
    narration: "The disks alone are not enough. Kubernetes also needs the objects that describe them. So the primary site writes the volume records, the claims and the group objects to an object store, the S3 archive. Think of the fireproof filing cabinet across town. The storage copy holds the bytes, the archive holds the labels."
    evidence: [drpc-status, source-trace]
    card:
      kind: S3 archive
      name: s3profile-ocp-primary-ocs-storagecluster
      role: the off-site copy of the Kubernetes paperwork
    def:
      what: "A bucket where Ramen saves the Kubernetes objects that describe the disks: volume records, claims and group objects."
      creator: "The primary site's VRG, on its own schedule."
      reader: "The target site's VRG during a failover."
      where: "The S3 profile named s3profile-ocp-primary-ocs-storagecluster."
      analogy: "A fireproof filing cabinet across town."

  - id: "1.9"
    chapter: The words you need
    visual: Card and definition for the DRPC.
    narration: "The move order is a hub object called DRPlacementControl, or DRPC. It is written by Ramen, the disaster-recovery operator that runs on the hub and the sites. It records which site should run the application and which action is in progress, and the console reads it. If you want to know what a failover, the move to the other site, is doing, this is the object to read first."
    evidence: [drpc-status, source-trace]
    card:
      kind: DRPlacementControl
      name: gitops-vm-protection
      role: the move order and the record of its progress
    def:
      what: "The hub object that records which cluster should run the application and which action is in progress. The console reads it."
      creator: "The Ramen hub operator, from the application placement."
      reader: "The Ramen hub operator, the console, and anyone debugging a move."
      where: "Hub cluster, namespace openshift-dr-ops."
      analogy: "The dispatcher's clipboard."

  - id: "1.10"
    chapter: The words you need
    visual: Card and definition for the VRG.
    narration: "Each site has a manager for the application: the VolumeReplicationGroup, or VRG. It finds the claims, asks for replication, restores the paperwork after a move, and reports whether the site is ready. The hub delivers it to the site, and the site's operator does the local work."
    evidence: [vrg-primary, source-trace]
    card:
      kind: VolumeReplicationGroup
      name: gitops-vm-protection
      role: the site manager for one application
    def:
      what: "Ramen's per-application object on a site. It finds the claims, requests replication, restores the paperwork, and reports readiness."
      creator: "The Ramen hub operator, delivered to the site as a ManifestWork."
      reader: "The Ramen site operator and the hub."
      where: "Site cluster, namespace openshift-dr-ops."
      analogy: "The site manager at each factory."

  - id: "1.11"
    chapter: The words you need
    visual: Card and definition for the group objects, with one container and a manifest.
    narration: "Eight disks move as one. A VolumeGroupReplication groups them. Its content object, the VolumeGroupReplicationContent, holds the group handle, the storage system ID for the container, and the list of disk handles. One VolumeReplication is the switch that promotes or demotes the whole group. The container keeps the disks consistent, and the manifest says what is inside."
    evidence: [vgr-primary, source-trace]
    card:
      kind: VolumeGroupReplication
      name: vgr-b7e3115af7a9714fe9c0857d760dc769-gitops-vm-protection
      role: one container for eight disks
    def:
      what: "A csi-addons object that treats several disks as one group, so they are promoted, demoted and resynced together. Its content object holds the group handle and the disk list."
      creator: "Ramen, when the DRPolicy says the storage supports grouping."
      reader: "csi-addons and the storage driver."
      where: "Site cluster, namespace gitops-vms."
      analogy: "One shipping container instead of eight parcels, with a manifest listing what is inside."

  - id: "1.12"
    chapter: The words you need
    visual: Card and definition for the translator and the storage driver.
    narration: "Two helpers do the storage work. csi-addons translates Kubernetes replication objects into storage calls. The CSI driver performs them: create the group, promote it, change its members, or resync it. Ramen decides, csi-addons translates, the driver moves the bytes. Three different jobs, often confused."
    evidence: [vgr-primary, source-trace]
    card:
      kind: Controller
      name: csi-addons and the CSI driver
      role: the translator and the crew that move the disks
    def:
      what: "csi-addons turns replication objects into storage calls. The CSI driver performs them: create, promote, change members, resync."
      creator: "The storage operator installs both."
      reader: "Ramen, through the objects it writes."
      where: "Site clusters, namespace openshift-storage."
      analogy: "A translator and the warehouse crew."

  - id: "1.13"
    chapter: The words you need
    visual: Card and definition for the console.
    narration: "The console is a display, not a measurement. It reads the DRPC and the VRG and shows their status. When it says complete, it means the object it read said complete. It does not check the disks, the claims or the virtual machine. That is why a console message and the API can disagree."
    evidence: [screenshot, drpc-status]
    card:
      kind: Console
      name: Data Services · Disaster recovery
      role: shows what the DR objects report
    def:
      what: "The web page that displays the DR objects. It reads their status. It does not measure the storage or the data."
      creator: "The OpenShift Data Foundation console plugin."
      reader: "Operators starting and watching a move."
      where: "The hub's web console."
      analogy: "The departure board at an airport. It shows what the system reports, not the weather."

  - id: "1.14"
    chapter: The words you need
    visual: Card and definition for the status vocabulary, with phase, progression and conditions separated.
    narration: "One more word set, because the stall is written in it. A phase is where the move is. A progression is what it is doing right now. A condition is a named check with a true or false value, a reason and a message. When the console and the API disagree, these three fields are how you tell."
    evidence: [drpc-status, source-trace]
    card:
      kind: Status fields
      name: phase, progression, condition
      role: where the move is, what it is doing, and which checks pass
    def:
      what: "Phase is the current state of the move. Progression is the step inside that state. A condition is a named check with a status, reason and message."
      creator: "The Ramen hub operator writes them on the DRPC and the VRG."
      reader: "The console, the hub, and anyone debugging a move."
      where: "Status of the DRPC and the VRG."
      analogy: "A parcel: phase is which depot it is in, progression is what the depot is doing, conditions are the scan checks."

  - id: "1.15"
    chapter: The words you need
    visual: Five-job summary strip, with the three layers marked underneath.
    narration: "Five jobs, one chain. Ramen decides and records. csi-addons translates. The storage driver moves the disks. The persistent volume controller binds claims to volume records. Kubernetes starts the machine only after all of them agree. The rest of this video follows one handoff at a time, in the order they happened."
    evidence: [source-trace]
    concept:
      title: "Five jobs, one chain"
      rows:
        - k: "Ramen"
          t: "Decides and records the recovery. Owns the DRPC and the VRG."
          c: blue
        - k: "csi-addons"
          t: "Translates replication objects into storage calls."
          c: cyan
        - k: "CSI driver"
          t: "Moves, promotes and resyncs the disks."
          c: green
        - k: "PV controller"
          t: "Binds each claim to its volume record, using names and UIDs."
          c: amber
        - k: "Kubernetes"
          t: "Starts the virtual machine only after the claim is Bound."
          c: purple
    pause_after: 1.2

  - id: "2.1"
    chapter: What protection looked like
    visual: Timeline from protection to the click, with the data and paperwork layers marked.
    narration: "Before the click, there has to be something to recover. A failover does not create data. It tells the other site to use the copy it already has. That copy has two parts: the disks, and the Kubernetes paperwork that says which disk belongs to which claim. Both have to be right. We are now in the paperwork layer."
    evidence: [drpc-status, source-trace]
    pause_after: 1.2

  - id: "2.2"
    chapter: What protection looked like
    visual: Hub, two sites and their in-cluster storage.
    narration: "The lab has three clusters. The hub is the small manager. ocp-primary and ocp-secondary are the two application sites. Each site runs its own OpenShift Data Foundation storage inside the cluster, so there is no external array here. The claims use one storage class, ocs-storagecluster-ceph-rbd-virtualization, the template that says which storage provides their disks."
    evidence: [versions, pvc-primary]

  - id: "2.3"
    chapter: What protection looked like
    visual: Four virtual machine cards on the primary, empty target.
    narration: "On ocp-primary, four virtual machines were running. Their names were rhel9-node-001, rhel9-node-pvc-001, windows2k22-server-001 and windows2k25-server-001. On ocp-secondary, the namespace gitops-vms existed too, but it held no virtual machines at all."
    evidence: [vm-inventory, vm-secondary]
    pause_after: 1.2

  - id: "2.4"
    chapter: What protection looked like
    visual: Eight claim names in one consistency group.
    narration: "Each machine had two disks, a root disk and a data disk, so the namespace held eight claims. All eight carried the same consistency group label. That label is what tells Ramen to move them as one group, so they change role together instead of one at a time."
    evidence: [drpc-status, vgr-primary, pvc-primary]
    define:
      term: consistency group
      text: "A label that ties several claims together so they are replicated and moved as one unit."

  - id: "2.5"
    chapter: What protection looked like
    visual: DRPolicy and peer class values.
    narration: "The rule for the move was a DRPolicy named 2m-vm. It said: copy every two minutes, use the storage class above, and require the flatten-mode label set to force, a driver setting that decides how the copy is exposed. The peer class then reported grouping true. Grouping is a result of the storage matching on both sides, not a field you set in the policy."
    evidence: [drpolicy, vrg-secondary, source-trace]
    define:
      term: peer class
      text: "The policy's record of which storage classes match across the two clusters, and whether they can be grouped."

  - id: "2.6"
    chapter: What protection looked like
    visual: VGR, VGRC and group VolumeReplication cards on the primary.
    narration: "On the primary, the group existed as three objects. The VolumeGroupReplication is the container. The VolumeGroupReplicationContent holds its group handle and the list of disk handles. One VolumeReplication, whose data source is the group, is the switch that promotes or demotes it. Their exact names are on screen."
    evidence: [vgr-primary]

  - id: "2.7"
    chapter: What protection looked like
    visual: Protected conditions and the recorded sync time.
    narration: "The hub reported Protected true. The primary VRG reported ClusterDataProtected true with reason Uploaded, and the group last synced at 20:08 UTC. In plain words, the last disk copy and the last paperwork upload had both completed. It did not promise that the next restore would produce a usable set of claims."
    evidence: [drpc-status, vrg-summary, vgr-primary]
    define:
      term: Protected
      text: "A DRPC condition meaning the last disk copy and the last paperwork upload completed. It is a past check, not a promise about the next restore."
    pause_after: 1.4

  - id: "2.8"
    chapter: What protection looked like
    visual: Recap strip.
    narration: "So far: four machines, eight claims, one consistency group, three group objects, and a completed sync at 20:08. Everything the move needs is supposed to be on the target already. The next event is a single field on the hub."
    evidence: [drpc-status, vrg-summary]

  - id: "3.1"
    chapter: The move order
    visual: Hub region highlighted, sites dimmed.
    narration: "The decision belongs to the hub because there is only one copy of it. The two sites each own their local objects, but only the DRPC records which site should run the application and which action is running. That is why the move starts with one object on the hub. We are now in the handover layer, at the decision."
    evidence: [source-trace]

  - id: "3.2"
    chapter: The move order
    t: "20:10:43"
    visual: DRPC spec after the click.
    narration: "At 20:10:43 UTC, the DRPC received action Failover with the failover cluster set to ocp-secondary. The preferred cluster stayed ocp-primary. Preferred means where the application should normally run. Failover means run it somewhere else now, and the console showed the action as started, not finished."
    evidence: [drpc-status, drpc-list, versions]
    define:
      term: preferred cluster
      text: "The site where the application should normally run. A failover runs it at the other site, while the preferred site stays recorded."

  - id: "3.3"
    chapter: The move order
    visual: Arrow from the hub DRPC to the target VRG.
    narration: "The hub then sent one instruction to the target: set its VRG to Primary. It travels as a ManifestWork, which is an envelope that carries an object to a site and returns a receipt saying what was applied. Everything that follows on ocp-secondary happens because that one field changed."
    evidence: [source-trace, drpc-status]
    define:
      term: ManifestWork
      text: "The ACM object that carries a resource from the hub to a site, and reports what the site applied."

  - id: "3.4"
    chapter: The move order
    visual: Progression, Available and PeerReady conditions.
    narration: "The hub recorded progression WaitForResourceRestore, with the message waiting for App resources to be restored. Available became false. PeerReady became false with reason NotStarted. Those two conditions then stayed false, and nothing on the hub rewrote them while it waited."
    evidence: [drpc-status, source-trace]
    define:
      term: progression
      text: "The step the DRPC is working on inside its current phase. It is where the detail lives."

  - id: "3.5"
    chapter: The move order
    visual: Three readiness gates.
    narration: "To finish, the hub waits for three things on the target VRG. DataReady must be true, ClusterDataReady must be true, and the state must be Primary. Each condition must also have been observed at the object's current generation, a counter Kubernetes increments on every spec change, so an old true does not count."
    evidence: [source-trace]
    define:
      term: generation
      text: "A counter Kubernetes increments on every spec change. A condition only counts if it was observed at the current generation."

  - id: "3.6"
    chapter: The move order
    visual: Phase and progression shown on separate lines.
    narration: "The DRPC phase had already become FailedOver, because the target VRG existed and was being made Primary. That branch only waits. It does not rewrite the old Available message. So the phase can look finished while the progression is still WaitForReadiness. Phase is where it is, progression is what it is doing."
    evidence: [source-trace, drpc-status]
    pause_after: 1.4

  - id: "3.7"
    chapter: The move order
    visual: Recap strip.
    narration: "So far: one click, one envelope, one instruction to the target, and three gates the hub will not skip. The target now has to rebuild the paperwork and make every claim usable. That is the next chapter, and it is where the run stopped."
    evidence: [drpc-status]

  - id: "4.1"
    chapter: Rebuilding the paperwork
    visual: Target VRG reading the archive.
    narration: "The disks already exist on ocp-secondary, because they were copied every two minutes. What does not exist is the Kubernetes description of them: which image is which claim, and which claims belong to the group. Restore here does not mean copying the disks again. It means recreating the objects that describe them. Without those objects, no pod can use the disks."
    evidence: [vrg-secondary, source-trace]

  - id: "4.2"
    chapter: Rebuilding the paperwork
    visual: Four-step restore order.
    narration: "The target restores in a fixed order: volume records first, then claims, then the group content, then the group itself. That order surprises people. The group objects come last, and a failure in an earlier step stops the later ones in that pass, so a broken claim list also blocks the group restore."
    evidence: [source-trace, restore-log]

  - id: "4.3"
    chapter: Rebuilding the paperwork
    visual: A copied volume record with its claim reference.
    narration: "Before creating a volume record, Ramen clears its claim reference UID but keeps the claim name and namespace. Kubernetes calls that pre-bound: the volume is reserved for a claim that does not exist yet. The empty UID is deliberate, and on the normal path it acts as a wildcard that matches the new claim."
    evidence: [source-trace, pv-secondary-claimrefs]
    define:
      term: pre-bound
      text: "A volume whose claim reference names a claim but has no UID yet. Kubernetes treats it as reserved for that claim."

  - id: "4.4"
    chapter: Rebuilding the paperwork
    visual: Conditional handle rewrite.
    narration: "Ramen rewrites the disk ID in the volume record only when the archived record carries the annotation ramendr.openshift.io/destination-volume-handle. That annotation holds the target site's own disk ID. If the annotation is absent, Ramen writes the archived ID back unchanged."
    evidence: [source-trace, pv-primary-annotations]
    define:
      term: destination-volume-handle
      text: "An annotation on the archived volume record that holds the target site's disk ID. Without it, the restore reuses the source ID."

  - id: "4.5"
    chapter: Rebuilding the paperwork
    visual: Annotation list from the primary volume records.
    narration: "On this primary, every volume record carried the vr-archived and vr-retained annotations. None carried the destination handle annotation. The ticket records that as a fact about all eight claims, so the restore had no target ID to use."
    evidence: [pv-primary-annotations, ticket]

  - id: "4.6"
    chapter: Rebuilding the paperwork
    visual: Primary and target handles side by side.
    narration: "So the six restored volume records kept the primary's disk ID. For rhel9-node-001, the target ID was byte for byte the same as the primary, ending in e6d8e968. The exact record name is on screen. The storage on the target was never asked for its own identity."
    evidence: [pv-handles]
    pause_after: 1.2

  - id: "4.7"
    chapter: Rebuilding the paperwork
    visual: Driver capability to annotation chain.
    narration: "That annotation is written on the primary, and only when the VRG reports DestinationInfoAvailable true. That condition comes from the storage driver's GetReplicationDestinationInfo response. If the driver never advertises it, the annotation is never written, and the restore has no destination ID."
    evidence: [source-trace, vgr-primary]

  - id: "4.8"
    chapter: Rebuilding the paperwork
    visual: Recap strip.
    narration: "So far: the paperwork was rebuilt, but one field still points at the primary's image. That is a real defect, and it will matter later when a pod asks for the disk. It is not the reason the claims are Lost. The next chapter shows the count that never reaches eight."
    evidence: [pv-handles, vrg-secondary]

  - id: "5.1"
    chapter: The count that never reached eight
    visual: Restore counter.
    narration: "Why does a count decide the whole recovery? Because the target VRG reports ClusterDataReady only after every restore step succeeds. One object that exists but is not counted keeps the whole application not ready. The count is not cosmetic. It is the gate. We are still in the paperwork layer."
    evidence: [source-trace, vrg-secondary]

  - id: "5.2"
    chapter: The count that never reached eight
    t: "20:11:18"
    visual: Volume record list and claim list restored in sequence.
    narration: "The restore loop reads a list of objects from the archive. For each object it creates what is missing, and for each object that already exists it runs a validation. If validation fails, the object is skipped and the restored count stays short. Then the loop moves on to the next object."
    evidence: [source-trace, restore-log]

  - id: "5.3"
    chapter: The count that never reached eight
    visual: Validation and skip log lines.
    narration: "For a claim, the validation is simple: it must be Bound. A claim that exists in Pending or Lost phase is rejected with the message PVC exists and is not bound. The controller logs Object exists, ignoring and moving to next object, and continues. Bound means the claim is matched to a volume and ready for a pod."
    evidence: [restore-log, source-trace]
    define:
      term: Bound
      text: "The claim is matched to a volume record and ready for a pod to use. A Pending or Lost claim is not Bound."

  - id: "5.4"
    chapter: The count that never reached eight
    visual: The three different counts.
    narration: "The result was Total slash Restored eight slash one: eight claims in the list, one counted as restored. Later the log shows the warning Mismatch in PV and PVC count six slash one, and the DRPC status shows eight slash zero. The numbers move between components, the outcome does not. Eight requests, one counted as restored."
    evidence: [restore-log, drpc-status]
    pause_after: 1.2

  - id: "5.5"
    chapter: The count that never reached eight
    visual: Claim phase table.
    narration: "On the target, six claims were Lost and two were Pending. The six Lost claims named a volume record that did exist. The two Pending claims named volume records that did not exist at all. That split is the whole story of the restore, and it points at two different problems."
    evidence: [pvc-pv-secondary-summary, pvc-secondary]

  - id: "5.6"
    chapter: The count that never reached eight
    visual: The two missing volume names.
    narration: "The two missing records were the data disks for rhel9-node-001 and windows2k22-server-001. Their full names are on screen. Eight claims, six volume records. No amount of retrying can restore a record that was never in the archive."
    evidence: [pvc-pv-secondary-summary]
    pause_after: 1.2

  - id: "5.7"
    chapter: The count that never reached eight
    visual: Recap strip.
    narration: "So far: the target has six disks and eight claims, and only one claim is counted as restored. The claim controller now has to decide what those six disks are bound to. That decision is pure Kubernetes, and it happens without asking the storage. The next chapter is the clerk's decision."
    evidence: [pvc-pv-secondary-summary]

  - id: "6.1"
    chapter: Why Kubernetes says Lost
    visual: Two layers, handle below and binding above.
    narration: "Two different questions are hiding here. Identity asks which real disk is behind this record, and it is answered by the storage ID. Ownership asks which claim owns this record, and it is answered by names, namespaces and UIDs. They fail at different layers, and mixing them up makes the failure look simpler than it is."
    evidence: [source-trace, k8s-source]

  - id: "6.2"
    chapter: Why Kubernetes says Lost
    visual: Annotations removed from a restored claim.
    narration: "When Ramen restores a claim, it removes the annotations that start with pv.kubernetes.io. That includes bind-completed, the mark that says this claim was already bound. A restored claim therefore enters the unbound path, where Kubernetes tries to bind it to its named volume. That is the intended path, and it normally works."
    evidence: [source-trace, k8s-source]
    define:
      term: bind-completed
      text: "An annotation Kubernetes puts on a claim after it binds. Its presence sends the claim down a different code path."

  - id: "6.3"
    chapter: Why Kubernetes says Lost
    visual: The unbound path and the empty UID wildcard.
    narration: "In the unbound path, the check is name, namespace and UID. An empty volume claim reference UID matches any claim UID, so a pre-bound volume binds. That is why the empty UID is a wildcard rather than a mistake. On this path, the recreated ticket would match the recreated ledger entry."
    evidence: [k8s-source, pv-secondary-claimrefs]

  - id: "6.4"
    chapter: Why Kubernetes says Lost
    visual: The bound path, marked unverified.
    narration: "But six claims did not take that path. They reached the bound path, which expects bind-completed to be present. That means those claims had been bound at some earlier point, and something re-added the annotation. The ticket does not record who or when, so this part is inference, not a recorded fact."
    evidence: [k8s-source, events]
    unverified: true

  - id: "6.5"
    chapter: Why Kubernetes says Lost
    visual: UID comparison and the claim result, with the locker analogy on screen.
    narration: "In the bound path, Kubernetes compares the volume's claim reference UID with the claim's UID. The restored volume has an empty UID. The claim has a real one. They differ, so Kubernetes marks the claim Lost and emits ClaimMisbound. In cloakroom terms, the ticket exists and the locker exists, but the ledger entry has no owner number, so the clerk refuses the match."
    evidence: [k8s-source, events]
    define:
      term: ClaimMisbound
      text: "A Kubernetes event meaning a claim and its volume disagree about which claim owns the volume."
    pause_after: 1.4

  - id: "6.6"
    chapter: Why Kubernetes says Lost
    visual: Exact event text, six times.
    narration: "The event text is exact: Two claims are bound to the same volume, this one is bound incorrectly. It appeared six times, once for each Lost claim. The message is about ownership, not about corrupted bytes. That distinction matters when you decide what to fix."
    evidence: [events]

  - id: "6.7"
    chapter: Why Kubernetes says Lost
    visual: Pending branch for a missing volume.
    narration: "The two Pending claims took the other branch. Their volume name pointed at a record that did not exist, so Kubernetes set them Pending and said it would try again later. No retry can create the missing record. It has to come back from the archive, or from a new restore."
    evidence: [k8s-source, pvc-pv-secondary-summary]

  - id: "6.8"
    chapter: Why Kubernetes says Lost
    visual: Handle problem shown at the attach layer.
    narration: "The retained primary disk ID is a third problem, one layer lower. When a pod is scheduled, the storage driver is asked to attach that ID on the target, where the ID either does not exist or names a different image state. That would break the attach, but it did not cause the Lost events."
    evidence: [source-trace, pv-handles]

  - id: "6.9"
    chapter: Why Kubernetes says Lost
    visual: Recap strip.
    narration: "So far: six Lost claims are an ownership mismatch, two Pending claims are missing records, and the wrong disk ID is a later attach problem. None of them is a failure of the replicated data. The copy arrived. The paperwork did not describe it correctly."
    evidence: [source-trace, pv-handles]

  - id: "7.1"
    chapter: Why it never finishes
    visual: Readiness chain from claim to DRPC.
    narration: "Why does one bad claim stop the entire DRPC? Because the readiness chain is serial. A claim that cannot bind cannot report ready. DataReady aggregates the per-claim conditions, so it stays false. The VRG state becomes Unknown, and the hub's three gates cannot all pass. One link holds the chain."
    evidence: [source-trace, vrg-secondary]
    define:
      term: DataReady
      text: "A VRG condition that aggregates the per-claim readiness. It is true only when every protected claim reports ready."

  - id: "7.2"
    chapter: Why it never finishes
    visual: The exact ClusterDataReady condition.
    narration: "The exact condition was ClusterDataReady false with reason Error, and the message Failed to restore PVs and PVCs. The detail inside it was Total slash Restored eight slash one. That condition is written only on the failure path. The success writer is never reached."
    evidence: [vrg-secondary, restore-log, source-trace]

  - id: "7.3"
    chapter: Why it never finishes
    visual: DataReady aggregation and state Unknown.
    narration: "DataReady is an aggregate of the per-claim conditions. A claim that cannot bind cannot report ready, so the aggregate cannot be true. With DataReady false, the VRG's state logic sets state Unknown. Unknown is a symptom here, not an independent finding, and it does not tell you what to fix."
    evidence: [vrg-secondary, source-trace]

  - id: "7.4"
    chapter: Why it never finishes
    visual: The three gates, two failing.
    narration: "The hub's readiness check needs DataReady true, ClusterDataReady true and state Primary. Two of the three were false, so the DRPC set progression WaitForReadiness and returned. It never reached the success write that would set Available true. That is the whole reason it waited."
    evidence: [source-trace, drpc-status]

  - id: "7.5"
    chapter: Why it never finishes
    t: "21:51:28"
    visual: The recorded console popover on the right, the stalled restore on the left.
    narration: "This is the console at 21:51 UTC. The title says Failover complete. The subtitle says two of four steps. The Restoring step is still spinning. Application volumes last synced at 20:08, Kubernetes resources at 20:11. The screen and the API disagree, and the API is the one that drives the move."
    evidence: [screenshot, drpc-status]
    screenshot: image-20260926-215128.png
    focus: {x: 212, y: 30, w: 418, h: 608}
    caption: "Hub console · DR Status popover while the failover was stalled"
    pause_after: 1.8

  - id: "7.6"
    chapter: Why it never finishes
    visual: Console defects labelled by ticket.
    narration: "Two console problems sit in that one popover. The title says complete before the cleanup step ends, tracked as VIRTDR-316. And the last-synced value is a driver report, not an independent measurement. Neither is the cause of the stall, and both make the stall harder to see. The recording labels them as known UI issues."
    evidence: [screenshot, ticket, vgr-primary]
    pause_after: 1.2

  - id: "7.7"
    chapter: Why it never finishes
    visual: The loop arrow.
    narration: "Every retry repeats the same sequence. The claim exists but is not bound, so it is skipped, so the count is short, so ClusterDataReady stays false. There is no error event, no timeout, and no escalation. The DRPC tries again and waits. In this run it had waited for more than an hour."
    evidence: [source-trace, restore-log, drpc-status]

  - id: "7.8"
    chapter: Why it never finishes
    visual: Recap strip.
    narration: "So far: the restore loop, the readiness chain and the console all point at the same stuck step. The remaining question is why the records and the disk IDs were wrong in the first place. The next chapter separates the two causes and what each one proves."
    evidence: [drpc-status, source-trace]

  - id: "8.1"
    chapter: Causes, fix and the checklist
    visual: Two independent causes.
    narration: "Why two causes? Because the ticket found one at the object store and one in the restore code. They are independent, and either one is enough to keep the failover from completing. Fixing one would not have made this run succeed, which is why both are worth understanding."
    evidence: [ticket, source-trace]

  - id: "8.2"
    chapter: Causes, fix and the checklist
    visual: Eight claims, six volume records in the archive.
    narration: "The first cause is in the archive. It held eight claims but only six volume records. The two missing records are the same two claims that stayed Pending. The restore loop compares the two counts, so six against eight can never pass. The archive was incomplete before the move started."
    evidence: [pvc-pv-secondary-summary, ticket, source-trace]
    pause_after: 1.2

  - id: "8.3"
    chapter: Causes, fix and the checklist
    visual: The 4.22 group content path.
    narration: "The second cause is in the restore code. The 4.22 branch we read does not rewrite the group handle in the VolumeGroupReplicationContent. It recreates the content with the source group ID, so csi-addons takes the modify-membership path with source handles. That is source-proven for the ref we read, and the deployed build is unverified."
    evidence: [source-trace]
    unverified: true

  - id: "8.4"
    chapter: Causes, fix and the checklist
    visual: The upstream repair functions.
    narration: "Upstream main contains the repair. It writes the destination group handle onto the content object, rewrites the disk handles from the volume mapping list, and updates the cluster ID. Those functions are absent from the 4.22 branch at the ref we read, which is why the restored group kept source values."
    evidence: [source-trace]

  - id: "8.5"
    chapter: Causes, fix and the checklist
    visual: What the ticket establishes and what it does not.
    narration: "What we cannot say is which commit built the running operator. The ticket team agreed on the missing records and on degraded retry behavior, and a fix author was named. The exact deployed build remains unverified. So treat the branch comparison as strong evidence, not as a build fingerprint."
    evidence: [ticket, versions, source-trace]
    unverified: true

  - id: "8.6"
    chapter: Causes, fix and the checklist
    visual: Checklist for a group failover.
    narration: "The practical checklist before you trust a group failover: every protected claim has a volume record in the archive, every record carries a destination handle, the group content is rewritten with the target group handle, every claim binds on the target, and ClusterDataReady turns true at the current generation."
    evidence: [source-trace, pv-primary-annotations, vrg-secondary]

  - id: "8.7"
    chapter: Causes, fix and the checklist
    visual: Full-chain recap.
    narration: "The chain in order: the hub sets the target VRG to Primary. The target restores volume records, then claims. Two records are missing, and the rest keep the primary disk ID. The claims fail to bind. ClusterDataReady stays false. The DRPC waits, and the console still says complete."
    evidence: [drpc-status, restore-log, source-trace]

  - id: "8.8"
    chapter: Causes, fix and the checklist
    visual: Proves and does not prove.
    narration: "What this one run proves: a group failover can report Protected true and still restore no usable claims. What it does not prove: that the missing records are the only cause, that the running build is the branch we read, or that the upstream fix works. Those are the next tests, not conclusions."
    evidence: [ticket, source-trace, versions]
    unverified: true

  - id: "8.9"
    chapter: Causes, fix and the checklist
    visual: Closing card.
    narration: "If you remember one thing, remember this. The storage copy was never the problem. The records that describe the disks, and the binding that follows, were. That is the part a group failover adds, and the part to check before you trust the next one."
    evidence: [drpc-status, source-trace]
    pause_after: 2.2
