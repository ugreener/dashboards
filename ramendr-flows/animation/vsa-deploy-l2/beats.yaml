# yamllint disable rule:line-length
ticket: VSA-DEPLOY-L2
run: 'reconstruction from live vCenter captures, no recorded test run'
direction: 'deployment failure analysis, then the isolated interconnect that fixed it'
beats:
  - id: "0.1"
    chapter: "Cold open"
    visual: "Title, two appliance silhouettes, one red, one green."
    narration: >-
      Two new storage appliances, same installer, same platform, same day. One worked.
      The other failed twice, at exactly the same point. This is the story of what was
      different, and why moving one private link into its own network made the difference.
    pause_after: 2.2
  - id: "0.2"
    chapter: "Cold open"
    visual: "Three struck-through suspects, then the one idea."
    narration: >-
      The fix was not a new version, more memory, or a replacement disk. It was one idea:
      the private link between the two halves of the appliance must not share a network
      with other appliances. First the pieces, then the evidence.
    pause_after: 1.6

  - id: "1.1"
    chapter: "The pieces"
    define:
      term: "PowerStore VSA"
      text: "A storage appliance made of software: two virtual machines on one VMware host, working as one storage system."
    narration: >-
      A PowerStore VSA is a storage appliance made of software. It is two virtual machines
      on a VMware host, working as one storage system. The shared address, the one you open
      in a browser, exists only after the two machines agree to form a cluster.
  - id: "1.2"
    chapter: "The pieces"
    define:
      term: "Node"
      text: "One of the two virtual machines. On its own it is not the appliance; the two nodes mirror each other and share the work."
    narration: >-
      Each virtual machine is called a node. One node alone is not the appliance. The two
      nodes mirror each other and share the work. If they cannot talk to each other, there
      is no appliance, even when both are switched on.
  - id: "1.3"
    chapter: "The pieces"
    define:
      term: "The three networks"
      text: "Management is how you reach the web page. Storage carries disk traffic. The interconnect is a private back channel between the two nodes."
    narration: >-
      The appliance uses three kinds of network. Management, where you reach its web page.
      Storage, where the servers send disk traffic. And the interconnect, a private back
      channel that only the two nodes use.
  - id: "1.4"
    chapter: "The pieces"
    define:
      term: "Port group"
      text: "A named door on a virtual switch. The name is a label, not a wall: two doors with the same network number open into the same room."
    narration: >-
      On VMware, a port group is a named door on a virtual switch. You attach a network
      adapter to it. The name is a label, not a wall. Two doors with the same network
      number open into the same room.
  - id: "1.5"
    chapter: "The pieces"
    define:
      term: "VLAN"
      text: "The network number that decides which room a door opens into. Untagged, VLAN zero, or a dash means the room with no number."
    narration: >-
      That network number is called a VLAN. Same number, same room. Untagged, shown as
      VLAN zero or a dash, means the room with no number. And two different switches can
      still share a room when their cables reach the same physical switch.
  - id: "1.6"
    chapter: "The pieces"
    define:
      term: "Interconnect"
      text: "The private path the two nodes use to find each other during installation and to mirror data afterwards."
    narration: >-
      The interconnect is the part that matters. During installation, the two nodes use it
      to find each other and agree to form the cluster. If that conversation goes wrong,
      the installation can stop before the appliance ever gets a management address.
    pause_after: 1.6

  - id: "2.1"
    chapter: "What happened"
    visual: "Appliance pair, then the installer progress stopping at the cluster step."
    narration: >-
      The deployment kit built two virtual machines and powered them on. The base operating
      system installed and the nodes rebooted. Then the appliance software was supposed to
      create the cluster and configure the network.
  - id: "2.2"
    chapter: "What happened"
    visual: "Nodes at a login prompt, no address."
    narration: >-
      On the failing appliance, that step never finished. The installer reported that it
      could not determine whether the cluster step succeeded. Both nodes then sat at a
      plain Linux login prompt, with no appliance and no management address.
  - id: "2.3"
    chapter: "What happened"
    screenshot: console-error-crop.png
    iw: 1024
    ih: 140
    focus: {x: 10, y: 94, w: 1004, h: 30}
    shot: {w: 1300, x: 310, y: 340}
    caption: "The failing node's console: the installer could not confirm the cluster step."
    narration: >-
      This is the console of the failing node. The installer could not confirm success from
      its own state file. That is not a disk error or a memory error. It is the installer
      saying it lost confidence in the cluster step.
    pause_after: 1.8
  - id: "2.4"
    chapter: "What happened"
    screenshot: console-login-crop.png
    iw: 700
    ih: 256
    focus: {x: 10, y: 20, w: 680, h: 220}
    shot: {w: 900, x: 510, y: 300}
    caption: "Hours later: a plain Linux login prompt, no appliance, no management address."
    narration: >-
      Hours later, the node was still at this login prompt. No web page, no cluster, no
      address. Both halves could boot, but neither had become an appliance.

  - id: "3.1"
    chapter: "What we ruled out"
    visual: "Two appliance cards side by side, a comparison table."
    narration: >-
      The obvious suspects were configuration and resources. So we compared the failing
      appliance with the one that worked, field by field, in vCenter.
  - id: "3.2"
    chapter: "What we ruled out"
    visual: "Hardware and property rows all matching."
    narration: >-
      The virtual hardware matched: six processors, eighteen gigabytes of memory, nine
      disks, the same firmware and the same tools. All twenty-five deployment properties
      matched too.
  - id: "3.3"
    chapter: "What we ruled out"
    visual: "Eight adapters lined up, management and storage identical, interconnect highlighted."
    narration: >-
      The network adapters matched as well: eight adapters in the same order, the same
      management and storage port groups. The only difference was where the two interconnect
      adapters were plugged in.
  - id: "3.4"
    chapter: "What we ruled out"
    screenshot: pg-old-untagged.png
    focus: {x: 400, y: 280, w: 1050, h: 45}
    caption: "An older pair's interconnect group: its own name, untagged, on the shared switch."
    narration: >-
      This is an older pair, and the failed pair used the same pattern: its own port group
      name, but untagged, on the one shared switch. A separate name, in the same room as
      every other appliance.
    pause_after: 1.8

  - id: "4.1"
    chapter: "Why it can break"
    visual: "Four pairs inside one room, frames crossing between them."
    narration: >-
      Four appliances shared that room. Every pair's discovery and heartbeat frames arrived
      in the same segment. Each pair could hear the others, and the others could hear it.
  - id: "4.2"
    chapter: "Why it can break"
    visual: "The vendor guide warning line, highlighted."
    narration: >-
      The vendor's deployment guide warns about exactly this. Each appliance must have its
      own interconnect networks, and sharing them causes communication problems and
      unexpected issues. It does not say the installer will stop when it hears a stranger,
      but that is a plausible way to lose confidence.
    unverified: true
  - id: "4.3"
    chapter: "Why it can break"
    visual: "Inference badge; encrypted partition door closed."
    narration: >-
      This part is inference, not a proven root cause. The real error is inside an encrypted
      system partition that only the vendor can read. What we know is that the failure
      reproduced, and the layout was the one the vendor warns against.
    unverified: true
    pause_after: 1.8
  - id: "4.4"
    chapter: "Why it can break"
    visual: "Second change named honestly: the host also moved."
    narration: >-
      There is a second change we should admit. The successful rebuild of the first
      appliance also landed on a different VMware host. So this is strong evidence, not a
      perfect experiment. The second appliance is the better control, because it stayed on
      the same host and still worked.

  - id: "5.1"
    chapter: "The change"
    screenshot: dvs-new.png
    focus: {x: 30, y: 60, w: 1300, h: 380}
    caption: "The new dedicated switch for the interconnect adapters."
    narration: >-
      The change was a new, dedicated virtual switch for the interconnect adapters. Nothing
      else moved. Management and storage stayed exactly where they were.
    pause_after: 1.8
  - id: "5.2"
    chapter: "The change"
    screenshot: pg-vlan1.png
    focus: {x: 400, y: 280, w: 1050, h: 45}
    caption: "First pair, interconnect link one: network number 1."
    narration: >-
      Each pair got its own port groups, and each group got its own network number. The
      first appliance uses number one and number two for its two interconnect links.
  - id: "5.3"
    chapter: "The change"
    screenshot: pg-vlan2.png
    focus: {x: 400, y: 280, w: 1050, h: 45}
    caption: "First pair, interconnect link two: network number 2."
    narration: >-
      The second appliance uses number three and number four. Number one and two are now a
      different room from number three and four, even though everything still shares the
      same physical host and cables.
  - id: "5.4"
    chapter: "The change"
    screenshot: pg-vlan3.png
    focus: {x: 400, y: 280, w: 1050, h: 45}
    caption: "Second pair, interconnect link one: network number 3, a different room."
    narration: >-
      This is the second pair's first interconnect group. Its number is three. The pair is
      alone in that room, because no other appliance has an adapter there.
  - id: "5.5"
    chapter: "The change"
    screenshot: vm-adapters.png
    focus: {x: 520, y: 490, w: 1000, h: 95}
    caption: "Inside the VM: adapters 2 and 3 are the interconnect, now behind the new switch."
    narration: >-
      Inside the virtual machine, the adapter order did not change. Adapter one is
      management, adapters two and three are the interconnect, and adapters four to eight
      are storage. Only the room behind adapters two and three changed.

  - id: "6.1"
    chapter: "The result"
    screenshot: vm-networks.png
    focus: {x: 350, y: 250, w: 1400, h: 90}
    caption: "Both nodes of the pair, and only they, on the two interconnect groups."
    narration: >-
      Both nodes of the first appliance now sit on the same two interconnect port groups,
      and each group shows exactly two virtual machines. That is the pair, and only the pair.
    pause_after: 1.8
  - id: "6.2"
    chapter: "The result"
    screenshot: vm-summary.png
    focus: {x: 380, y: 140, w: 1100, h: 120}
    caption: "Both nodes up, management addresses present, 18 GB and 6 processors."
    narration: >-
      The appliance came up with both nodes running, both management addresses present, and
      the cluster address answering. The array reports its state as configured, with no
      active alerts.
    pause_after: 1.8
  - id: "6.3"
    chapter: "The result"
    visual: "Both pairs on the new switch, both configured."
    narration: >-
      The second appliance was rebuilt the same way, with its own numbers, and it also came
      up configured. Two clean deployments, with one network variable changed.

  - id: "7.1"
    chapter: "Recap"
    define:
      term: "The short version"
      text: "A separate port group name is a label, not a wall. Untagged groups on one switch are one room, however many names they have. The interconnect needs its own room."
    narration: >-
      The short version. A separate port group name is a label, not a wall. Untagged groups
      on one switch are one room, however many names they have. The interconnect needs its
      own room.
  - id: "7.2"
    chapter: "Recap"
    define:
      term: "One practical caveat"
      text: "Both nodes share a host today, so their traffic stays local. If VMware moves a node, the physical cables must carry those network numbers."
    narration: >-
      One practical note. Both nodes of each pair happen to run on one host today, so their
      traffic never leaves it. If VMware moves one node, the cables must carry those network
      numbers. Confirm that with the network team before trusting the isolation.
  - id: "7.3"
    chapter: "Recap"
    define:
      term: "The one sentence to remember"
      text: "The appliance was never broken. The room was too crowded. Give the private link its own room, and the two halves can agree to become one."
    narration: >-
      The appliance was never broken. The room was too crowded. Give the private link its
      own room, and the two halves can finally agree to become one.
    pause_after: 2.4
